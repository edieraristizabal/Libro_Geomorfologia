<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 480" font-family="Arial, sans-serif">
  <rect width="700" height="480" fill="#ffffff"/>
  <text x="350" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#333333">Clima y tipo de meteorización dominante</text>

  <line x1="90" y1="420" x2="650" y2="420" stroke="#333333" stroke-width="2" marker-end="url(#ctArrow)"/>
  <line x1="90" y1="420" x2="90" y2="60" stroke="#333333" stroke-width="2" marker-end="url(#ctArrow)"/>
  <text x="370" y="455" text-anchor="middle" font-size="13" font-weight="bold" fill="#333333">Precipitación media anual →</text>
  <text x="45" y="240" text-anchor="middle" font-size="13" font-weight="bold" fill="#333333" transform="rotate(-90 45 240)">Temperatura media anual →</text>

  <!-- zones -->
  <rect x="90" y="60" width="250" height="180" fill="#a9d6a9" opacity="0.55"/>
  <text x="215" y="90" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a6b1a">Física dominante</text>
  <text x="215" y="105" text-anchor="middle" font-size="9" fill="#1a6b1a">(frío-templado, gelifracción)</text>

  <rect x="340" y="60" width="310" height="180" fill="#f5d78e" opacity="0.55"/>
  <text x="495" y="90" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a6100">Física y Química moderadas</text>
  <text x="495" y="105" text-anchor="middle" font-size="9" fill="#8a6100">(templado, semiárido)</text>

  <rect x="340" y="240" width="310" height="180" fill="#e8a87c" opacity="0.6"/>
  <text x="495" y="270" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a3a00">Química intensa</text>
  <text x="495" y="285" text-anchor="middle" font-size="9" fill="#8a3a00">(cálido-húmedo, tropical)</text>
  <text x="495" y="300" text-anchor="middle" font-size="9" fill="#8a3a00">perfiles profundos, laterización</text>

  <rect x="90" y="240" width="250" height="180" fill="#d8d8d8" opacity="0.55"/>
  <text x="215" y="270" text-anchor="middle" font-size="11" font-weight="bold" fill="#555555">Meteorización mínima</text>
  <text x="215" y="285" text-anchor="middle" font-size="9" fill="#555555">(árido-frío)</text>

  <text x="100" y="415" font-size="10" fill="#555555">seco</text>
  <text x="600" y="415" font-size="10" fill="#555555">húmedo</text>
  <text x="100" y="230" font-size="10" fill="#555555">cálido</text>
  <text x="100" y="70" font-size="10" fill="#555555">frío</text>

  <defs>
    <marker id="ctArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#333333"/></marker>
  </defs>
</svg>
