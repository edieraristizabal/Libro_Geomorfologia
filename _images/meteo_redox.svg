<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 280" font-family="Arial, sans-serif">
  <rect width="700" height="280" fill="#ffffff"/>
  <text x="350" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#333333">Óxido-reducción del hierro en el suelo</text>

  <g transform="translate(30,50)">
    <text x="140" y="0" text-anchor="middle" font-size="12" font-weight="bold" fill="#333333">Reducción (ambiente anóxico, saturado)</text>
    <rect x="20" y="30" width="240" height="100" fill="#7d8a8a"/>
    <text x="140" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">Fe²⁺ (ferroso)</text>
    <text x="140" y="150" text-anchor="middle" font-size="10" fill="#555555">soluble y móvil — colores grises/verdosos</text>
  </g>

  <line x1="350" y1="100" x2="350" y2="100" stroke="none"/>
  <path d="M 300 100 L 380 100" stroke="#333333" stroke-width="2" marker-end="url(#rxArrow)" transform="translate(-10,0)"/>

  <g transform="translate(400,50)">
    <text x="140" y="0" text-anchor="middle" font-size="12" font-weight="bold" fill="#333333">Oxidación (ambiente aireado)</text>
    <rect x="20" y="30" width="240" height="100" fill="#c0562e"/>
    <text x="140" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">Fe³⁺ (férrico)</text>
    <text x="140" y="150" text-anchor="middle" font-size="10" fill="#555555">insoluble, precipita — colores rojos/ocres</text>
  </g>

  <defs>
    <marker id="rxArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#333333"/></marker>
  </defs>
</svg>
