<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 560" font-family="Arial, sans-serif">
  <rect width="600" height="560" fill="#ffffff"/>
  <text x="300" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#333333">Diagrama ternario A-CN-K</text>

  <polygon points="300,60 60,480 540,480" fill="none" stroke="#333333" stroke-width="2"/>
  <text x="300" y="45" text-anchor="middle" font-size="13" font-weight="bold" fill="#333333">A (Al₂O₃)</text>
  <text x="40" y="505" text-anchor="middle" font-size="13" font-weight="bold" fill="#333333">CN (CaO*+Na₂O)</text>
  <text x="560" y="505" text-anchor="middle" font-size="13" font-weight="bold" fill="#333333">K (K₂O)</text>

  <!-- weathering trend arrow from fresh rock (near CN-K base) toward A apex -->
  <path d="M 260 400 Q 280 260 300 130" fill="none" stroke="#d62728" stroke-width="3" marker-end="url(#acnkArrow)"/>
  <circle cx="260" cy="400" r="6" fill="#8a6a45"/>
  <text x="200" y="415" font-size="11" fill="#333333">Roca fresca</text>
  <text x="310" y="180" font-size="11" fill="#d62728">Trayectoria de</text>
  <text x="310" y="196" font-size="11" fill="#d62728">meteorización</text>

  <circle cx="300" cy="100" r="6" fill="#2ca02c"/>
  <text x="310" y="95" font-size="11" fill="#2ca02c">Caolinita / Gibbsita</text>
  <text x="310" y="111" font-size="10" fill="#555555">(meteorización intensa)</text>

  <text x="300" y="540" text-anchor="middle" font-size="10" fill="#666666">Muestra la pérdida progresiva de cationes móviles (Ca, Na, K) hacia enriquecimiento en Al</text>
</svg>
