<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" font-family="Arial, sans-serif">
  <rect width="640" height="340" fill="#ffffff"/>
  <text x="320" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#333333">Factor de Seguridad en una ladera</text>

  <path d="M 60 280 L 400 280 L 560 80 L 560 280 Z" fill="#c9a06a" stroke="#6b4020" stroke-width="2"/>

  <!-- failure surface -->
  <path d="M 150 260 Q 320 210 470 130" fill="none" stroke="#d62728" stroke-width="3" stroke-dasharray="6 4"/>
  <text x="330" y="195" fill="#d62728" font-size="11" font-weight="bold">superficie de falla potencial</text>

  <!-- block on slope -->
  <path d="M 150 260 Q 320 210 470 130 L 470 160 Q 320 235 170 280 Z" fill="#a97a50" opacity="0.7"/>

  <!-- driving force arrow (along slope, downslope) -->
  <line x1="320" y1="220" x2="380" y2="255" stroke="#1f6feb" stroke-width="3.5" marker-end="url(#fsArrow1)"/>
  <text x="385" y="260" fill="#1f6feb" font-size="12" font-weight="bold">Fuerzas Impulsoras (τ)</text>

  <!-- resisting force arrow (opposite) -->
  <line x1="320" y1="220" x2="260" y2="185" stroke="#2ca02c" stroke-width="3.5" marker-end="url(#fsArrow2)"/>
  <text x="60" y="180" fill="#2ca02c" font-size="12" font-weight="bold">Fuerzas Resistentes (τf)</text>

  <text x="320" y="320" text-anchor="middle" font-size="13" font-weight="bold" fill="#333333">FS = Fuerzas Resistentes / Fuerzas Impulsoras</text>

  <defs>
    <marker id="fsArrow1" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1f6feb"/></marker>
    <marker id="fsArrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#2ca02c"/></marker>
  </defs>
</svg>
