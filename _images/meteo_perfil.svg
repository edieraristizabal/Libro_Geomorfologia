<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 480" font-family="Arial, sans-serif">
  <rect width="620" height="480" fill="#ffffff"/>
  <text x="310" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#333333">Perfil de meteorización</text>

  <rect x="180" y="50" width="220" height="50" fill="#4a3520"/>
  <text x="410" y="80" font-size="12" font-weight="bold" fill="#333333">A: Horizontes móviles (suelo, lixiviación)</text>

  <rect x="180" y="100" width="220" height="90" fill="#a0764a"/>
  <text x="410" y="130" font-size="12" font-weight="bold" fill="#333333">B: Roca meteorizada totalmente</text>
  <text x="410" y="148" font-size="10" fill="#555555">(suelo residual VI / saprolito V)</text>
  <text x="410" y="165" font-size="10" fill="#555555">fábrica de la roca destruida → conservada</text>

  <rect x="180" y="190" width="220" height="90" fill="#8a7256"/>
  <text x="410" y="220" font-size="12" font-weight="bold" fill="#333333">C: Roca meteorizada parcialmente</text>
  <text x="410" y="238" font-size="10" fill="#555555">controlada por discontinuidades</text>

  <rect x="180" y="280" width="220" height="90" fill="#6b6b6b"/>
  <text x="410" y="330" font-size="12" font-weight="bold" fill="#333333">D: Roca fresca (R)</text>

  <!-- bracket for regolito A+B+C -->
  <path d="M 170 55 L 155 55 L 155 275 L 170 275" fill="none" stroke="#333333" stroke-width="2"/>
  <text x="145" y="170" text-anchor="end" font-size="12" font-weight="bold" fill="#333333">Regolito</text>

  <text x="310" y="405" text-anchor="middle" font-size="11" fill="#666666">Espesor variable: desde pocos metros hasta decenas de metros en el trópico húmedo</text>
</svg>
