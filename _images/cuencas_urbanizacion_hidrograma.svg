<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 380" font-family="Arial, sans-serif">
  <rect width="620" height="380" fill="#ffffff"/>
  <text x="310" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#333333">Efecto de la urbanización en el hidrograma</text>

  <line x1="70" y1="320" x2="580" y2="320" stroke="#333333" stroke-width="2" marker-end="url(#urArrow)"/>
  <line x1="70" y1="320" x2="70" y2="60" stroke="#333333" stroke-width="2" marker-end="url(#urArrow)"/>
  <text x="330" y="355" text-anchor="middle" font-size="12" font-weight="bold" fill="#333333">tiempo →</text>
  <text x="35" y="190" text-anchor="middle" font-size="12" font-weight="bold" fill="#333333" transform="rotate(-90 35 190)">caudal →</text>

  <!-- rural hydrograph -->
  <path d="M 90 300 Q 200 270 250 200 Q 300 140 350 200 Q 420 260 550 300" fill="none" stroke="#2ca02c" stroke-width="3"/>
  <text x="400" y="150" fill="#2ca02c" font-size="12" font-weight="bold">Cuenca rural (con vegetación)</text>

  <!-- urban hydrograph: sharper, higher, faster -->
  <path d="M 90 300 Q 160 290 190 100 Q 210 60 240 100 Q 270 200 550 305" fill="none" stroke="#d62728" stroke-width="3"/>
  <text x="230" y="80" fill="#d62728" font-size="12" font-weight="bold">Cuenca urbanizada</text>

  <line x1="70" y1="90" x2="240" y2="90" stroke="#999999" stroke-width="1" stroke-dasharray="3 2"/>
  <text x="80" y="82" font-size="9" fill="#555555">mayor caudal pico</text>

  <text x="310" y="360" text-anchor="middle" font-size="10" fill="#666666" transform="translate(0,15)">Menor tiempo de retraso (lag time) y mayor caudal pico tras la urbanización</text>

  <defs>
    <marker id="urArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#333333"/></marker>
  </defs>
</svg>
