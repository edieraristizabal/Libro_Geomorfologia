<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" font-family="Arial, sans-serif">
  <rect width="820" height="300" fill="#ffffff"/>

  <!-- Divergent -->
  <g transform="translate(20,30)">
    <text x="120" y="0" text-anchor="middle" font-size="13" font-weight="bold" fill="#333333">A. Borde Divergente</text>
    <rect x="0" y="120" width="240" height="60" fill="#8c7a6b"/>
    <path d="M 90 120 L 120 80 L 150 120 Z" fill="#c0392b"/>
    <line x1="120" y1="120" x2="60" y2="60" stroke="#d62728" stroke-width="3" marker-end="url(#pa)"/>
    <line x1="120" y1="120" x2="180" y2="60" stroke="#d62728" stroke-width="3" marker-end="url(#pa)"/>
    <text x="120" y="215" text-anchor="middle" font-size="10" fill="#555555">Valle de rift, horsts y grabens</text>
  </g>

  <!-- Convergent -->
  <g transform="translate(300,30)">
    <text x="120" y="0" text-anchor="middle" font-size="13" font-weight="bold" fill="#333333">B. Borde Convergente</text>
    <rect x="0" y="130" width="110" height="50" fill="#8c7a6b"/>
    <path d="M 110 180 L 240 100 L 240 180 Z" fill="#a0522d"/>
    <path d="M 60 200 Q 100 220 150 130" fill="none" stroke="#5c4326" stroke-width="10" opacity="0.6"/>
    <path d="M 110 150 L 190 100" fill="none" stroke="#c0392b" stroke-width="6"/>
    <polygon points="185,95 200,98 190,110" fill="#c0392b"/>
    <line x1="90" y1="140" x2="130" y2="140" stroke="#d62728" stroke-width="3" marker-end="url(#pb)"/>
    <text x="120" y="215" text-anchor="middle" font-size="10" fill="#555555">Fosa, arco volcánico, prisma de acreción</text>
  </g>

  <!-- Transform -->
  <g transform="translate(580,30)">
    <text x="120" y="0" text-anchor="middle" font-size="13" font-weight="bold" fill="#333333">C. Borde Transformante</text>
    <rect x="0" y="130" width="110" height="50" fill="#8c7a6b"/>
    <rect x="130" y="130" width="110" height="50" fill="#96866f"/>
    <line x1="115" y1="100" x2="115" y2="200" stroke="#333333" stroke-width="2"/>
    <line x1="20" y1="115" x2="90" y2="115" stroke="#2ca02c" stroke-width="3" marker-end="url(#pc)"/>
    <line x1="220" y1="195" x2="150" y2="195" stroke="#2ca02c" stroke-width="3" marker-end="url(#pc)"/>
    <text x="120" y="215" text-anchor="middle" font-size="10" fill="#555555">Valles lineales, drenajes desplazados</text>
  </g>

  <defs>
    <marker id="pa" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#d62728"/></marker>
    <marker id="pb" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#d62728"/></marker>
    <marker id="pc" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#2ca02c"/></marker>
  </defs>
</svg>
