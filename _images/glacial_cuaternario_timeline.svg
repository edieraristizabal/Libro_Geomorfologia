<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 200" font-family="Arial, sans-serif">
  <rect width="760" height="200" fill="#ffffff"/>
  <text x="380" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#333333">Período Cuaternario</text>

  <line x1="40" y1="120" x2="720" y2="120" stroke="#333333" stroke-width="2"/>
  <rect x="40" y="100" width="640" height="40" fill="#b8d8e8"/>
  <rect x="700" y="100" width="20" height="40" fill="#e8a87c"/>

  <text x="360" y="95" text-anchor="middle" font-size="12" font-weight="bold" fill="#333333">Pleistoceno (ciclos glacial-interglacial)</text>
  <text x="710" y="90" text-anchor="middle" font-size="10" font-weight="bold" fill="#333333">Holoceno</text>

  <text x="40" y="160" font-size="11" fill="#555555">2.58 Ma</text>
  <text x="700" y="160" font-size="11" fill="#555555">0.0117 Ma</text>
