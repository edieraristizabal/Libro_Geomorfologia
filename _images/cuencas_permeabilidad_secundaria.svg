<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 300" font-family="Arial, sans-serif">
  <rect width="620" height="300" fill="#ffffff"/>
  <text x="310" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#333333">Permeabilidad primaria (matriz) vs. secundaria (macroporos)</text>

  <g transform="translate(30,50)">
    <text x="130" y="0" text-anchor="middle" font-size="12" font-weight="bold" fill="#333333">Flujo matricial (lento)</text>
    <rect x="20" y="30" width="220" height="180" fill="#c9a06a"/>
    <g fill="#8a7256">
      <circle cx="60" cy="70" r="8"/><circle cx="90" cy="80" r="7"/><circle cx="120" cy="65" r="9"/>
      <circle cx="150" cy="85" r="8"/><circle cx="180" cy="70" r="7"/><circle cx="210" cy="80" r="8"/>
      <circle cx="70" cy="120" r="8"/><circle cx="100" cy="130" r="7"/><circle cx="140" cy="115" r="9"/>
      <circle cx="170" cy="135" r="8"/><circle cx="200" cy="120" r="7"/>
    </g>
    <path d="M 60 40 Q 70 100 90 200" stroke="#1f6feb" stroke-width="1.5" fill="none" stroke-dasharray="2 2"/>
    <path d="M 150 40 Q 140 100 160 200" stroke="#1f6feb" stroke-width="1.5" fill="none" stroke-dasharray="2 2"/>
    <text x="130" y="235" text-anchor="middle" font-size="10" fill="#555555">infiltración lenta entre poros pequeños</text>
  </g>

  <g transform="translate(330,50)">
    <text x="130" y="0" text-anchor="middle" font-size="12" font-weight="bold" fill="#333333">Flujo por macroporos (rápido)</text>
    <rect x="20" y="30" width="220" height="180" fill="#c9a06a"/>
    <path d="M 70 30 L 60 210" stroke="#1f6feb" stroke-width="6"/>
    <path d="M 160 30 Q 180 100 150 210" stroke="#1f6feb" stroke-width="6"/>
    <text x="80" y="50" font-size="9" fill="#555555">grieta</text>
    <text x="190" y="60" font-size="9" fill="#555555">raíz</text>
    <text x="130" y="235" text-anchor="middle" font-size="10" fill="#555555">infiltración y flujo rápidos por fracturas y canales de raíces</text>
  </g>
</svg>
