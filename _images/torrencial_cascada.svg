<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 240" font-family="Arial, sans-serif">
  <rect width="780" height="240" fill="#ffffff"/>
  <text x="390" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#333333">Fenómeno en cascada</text>

  <g font-size="11" text-anchor="middle" fill="#ffffff">
    <rect x="20" y="70" width="160" height="70" rx="8" fill="#1f6feb"/>
    <text x="100" y="100">Detonante</text>
    <text x="100" y="118">(lluvia intensa, sismo)</text>

    <rect x="220" y="70" width="180" height="70" rx="8" fill="#e67e22"/>
    <text x="310" y="100">Evento secundario</text>
    <text x="310" y="118">(enjambre de deslizamientos)</text>

    <rect x="440" y="70" width="160" height="70" rx="8" fill="#8a6a45"/>
    <text x="520" y="95">Aporte masivo</text>
    <text x="520" y="113">de sedimento</text>
    <text x="520" y="131">al canal</text>

    <rect x="640" y="70" width="120" height="70" rx="8" fill="#a0522d"/>
    <text x="700" y="100">Avenida</text>
    <text x="700" y="118">torrencial</text>
  </g>

  <path d="M 180 105 L 215 105" stroke="#333333" stroke-width="2.5" marker-end="url(#tcArrow2)"/>
  <path d="M 400 105 L 435 105" stroke="#333333" stroke-width="2.5" marker-end="url(#tcArrow2)"/>
  <path d="M 600 105 L 635 105" stroke="#333333" stroke-width="2.5" marker-end="url(#tcArrow2)"/>

  <text x="390" y="200" text-anchor="middle" font-size="10" fill="#666666">Un flujo de agua normal se transforma en una mezcla densa por el aporte súbito de sedimento</text>

  <defs>
    <marker id="tcArrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#333333"/></marker>
  </defs>
</svg>
