<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" font-family="Arial, sans-serif">
  <rect width="640" height="340" fill="#ffffff"/>
  <text x="320" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#333333">Estructuras intrusivas (plutónicas)</text>

  <!-- host rock layers -->
  <g stroke="#8a6a45" stroke-width="1">
    <rect x="20" y="60" width="600" height="30" fill="#e8d29a"/>
    <rect x="20" y="90" width="600" height="30" fill="#d9c184"/>
    <rect x="20" y="120" width="600" height="30" fill="#c9a06a"/>
    <rect x="20" y="150" width="600" height="150" fill="#b98f5e"/>
  </g>

  <!-- batholith -->
  <ellipse cx="120" cy="280" rx="90" ry="70" fill="#a0522d" stroke="#5c2f10" stroke-width="2"/>
  <text x="120" y="325" text-anchor="middle" font-size="11" font-weight="bold" fill="#333333">Batolito</text>

  <!-- dike cutting across layers -->
  <rect x="280" y="60" width="18" height="240" fill="#c0392b" transform="rotate(8 289 180)"/>
  <text x="330" y="70" font-size="11" font-weight="bold" fill="#333333">Dique</text>

  <!-- sill parallel to layers -->
  <rect x="380" y="118" width="150" height="14" fill="#c0392b"/>
  <text x="455" y="110" text-anchor="middle" font-size="11" font-weight="bold" fill="#333333">Sill</text>

  <!-- laccolith doming layers -->
  <ellipse cx="560" cy="250" rx="70" ry="45" fill="#c0392b"/>
  <path d="M 490 210 Q 560 140 630 210" fill="none" stroke="#8a6a45" stroke-width="3"/>
  <text x="560" y="220" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">Laccolito</text>
</svg>
