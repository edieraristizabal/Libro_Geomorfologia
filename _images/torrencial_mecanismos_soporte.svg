<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" font-family="Arial, sans-serif">
  <rect width="800" height="260" fill="#ffffff"/>
  <text x="400" y="22" text-anchor="middle" font-size="15" font-weight="bold" fill="#333333">Mecanismos de soporte de sedimentos</text>

  <g transform="translate(10,45)">
    <text x="90" y="0" text-anchor="middle" font-size="11" font-weight="bold" fill="#333333">1. Turbulencia</text>
    <rect x="20" y="20" width="140" height="90" fill="#7fb3d5" opacity="0.5"/>
    <circle cx="60" cy="60" r="4" fill="#333333"/><circle cx="90" cy="45" r="3" fill="#333333"/><circle cx="120" cy="70" r="5" fill="#333333"/>
    <path d="M 40 90 Q 60 70 40 50" stroke="#1f6feb" stroke-width="1" fill="none"/>
    <text x="90" y="130" text-anchor="middle" font-size="9" fill="#555555">remolinos levantan partículas</text>
  </g>

  <g transform="translate(215,45)">
    <text x="90" y="0" text-anchor="middle" font-size="11" font-weight="bold" fill="#333333">2. Boyancia</text>
    <rect x="20" y="20" width="140" height="90" fill="#8a7256" opacity="0.6"/>
    <circle cx="90" cy="65" r="20" fill="#5c4326"/>
    <text x="90" y="130" text-anchor="middle" font-size="9" fill="#555555">matriz densa "flota" bloques</text>
  </g>

  <g transform="translate(420,45)">
    <text x="90" y="0" text-anchor="middle" font-size="11" font-weight="bold" fill="#333333">3. Matriz Cohesiva</text>
    <rect x="20" y="20" width="140" height="90" fill="#6b4f30"/>
    <circle cx="60" cy="55" r="14" fill="#a0522d"/><circle cx="105" cy="75" r="18" fill="#a0522d"/>
    <text x="90" y="130" text-anchor="middle" font-size="9" fill="#555555">lodo sostiene bloques grandes</text>
  </g>

  <g transform="translate(625,45)">
    <text x="90" y="0" text-anchor="middle" font-size="11" font-weight="bold" fill="#333333">4. Fuerzas Dispersivas</text>
    <rect x="20" y="20" width="140" height="90" fill="#d8d8d8"/>
    <circle cx="50" cy="90" r="10" fill="#8a8a8a"/><circle cx="80" cy="70" r="12" fill="#8a8a8a"/><circle cx="115" cy="45" r="15" fill="#8a8a8a"/>
    <text x="90" y="130" text-anchor="middle" font-size="9" fill="#555555">colisión de granos → gradación inversa</text>
  </g>
</svg>
