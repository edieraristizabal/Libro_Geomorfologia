<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 260" font-family="Arial, sans-serif">
  <rect width="780" height="260" fill="#ffffff"/>
  <text x="390" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#333333">Continuo de avenidas torrenciales</text>

  <line x1="60" y1="200" x2="720" y2="200" stroke="#333333" stroke-width="2" marker-end="url(#tcArrow)"/>
  <text x="390" y="230" text-anchor="middle" font-size="12" font-weight="bold" fill="#333333">Concentración y tamaño del sedimento →</text>

  <rect x="60" y="80" width="200" height="80" fill="#7fb3d5" opacity="0.7"/>
  <text x="160" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f6feb">Creciente Súbita</text>
  <text x="160" y="125" text-anchor="middle" font-size="10" fill="#333333">flujo diluido,</text>
  <text x="160" y="140" text-anchor="middle" font-size="10" fill="#333333">turbulento (Newtoniano)</text>

  <rect x="290" y="80" width="200" height="80" fill="#e8a87c" opacity="0.8"/>
  <text x="390" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0562e">Inundación de Escombros</text>
  <text x="390" y="125" text-anchor="middle" font-size="10" fill="#333333">flujo hiperconcentrado</text>
  <text x="390" y="140" text-anchor="middle" font-size="10" fill="#333333">(transicional)</text>

  <rect x="520" y="80" width="200" height="80" fill="#a0522d" opacity="0.85"/>
  <text x="620" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#5c2f10">Flujo de Escombros</text>
  <text x="620" y="125" text-anchor="middle" font-size="10" fill="#ffffff">flujo denso,</text>
  <text x="620" y="140" text-anchor="middle" font-size="10" fill="#ffffff">cohesivo/friccional (No-Newtoniano)</text>

  <defs>
    <marker id="tcArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#333333"/></marker>
  </defs>
</svg>
