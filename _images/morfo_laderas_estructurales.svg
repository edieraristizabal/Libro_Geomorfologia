<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" font-family="Arial, sans-serif">
  <rect width="640" height="320" fill="#ffffff"/>
  <text x="320" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#333333">Laderas estructurales</text>

  <!-- strata layers -->
  <g>
    <path d="M 60 260 L 320 100 L 340 110 L 80 270 Z" fill="#e2c98a" stroke="#6b4020" stroke-width="1"/>
    <path d="M 80 270 L 340 110 L 360 122 L 100 282 Z" fill="#d6b876" stroke="#6b4020" stroke-width="1"/>
    <path d="M 100 282 L 360 122 L 380 135 L 120 293 Z" fill="#c9a06a" stroke="#6b4020" stroke-width="1"/>
  </g>

  <!-- Cataclinal slope (dip slope) following the strata -->
  <line x1="60" y1="260" x2="320" y2="100" stroke="#1f6feb" stroke-width="4"/>
  <text x="180" y="90" fill="#1f6feb" font-size="12" font-weight="bold">Ladera Cataclinal</text>
  <text x="150" y="75" fill="#1f6feb" font-size="10">(sigue el buzamiento)</text>

  <!-- Anaclinal slope cutting across (scarp) -->
  <line x1="320" y1="100" x2="380" y2="293" stroke="#d62728" stroke-width="4"/>
  <text x="400" y="200" fill="#d62728" font-size="12" font-weight="bold">Ladera Anaclinal</text>
  <text x="400" y="216" fill="#d62728" font-size="10">(corta los estratos)</text>

  <!-- Orthoclinal (along strike, valley wall, shown as a separate small inset) -->
  <g transform="translate(430,40)">
    <rect x="0" y="0" width="170" height="130" fill="none" stroke="#cccccc" stroke-width="1"/>
    <text x="85" y="16" text-anchor="middle" font-size="11" font-weight="bold" fill="#2ca02c">Ladera Ortoclinal</text>
    <path d="M 20 110 L 60 30 L 100 30 L 140 110 Z" fill="#c9a06a" stroke="#6b4020" stroke-width="1.5"/>
    <line x1="20" y1="110" x2="60" y2="30" stroke="#2ca02c" stroke-width="3"/>
    <text x="85" y="122" text-anchor="middle" font-size="9" fill="#555555">valle excavado a lo largo del rumbo</text>
  </g>
</svg>
