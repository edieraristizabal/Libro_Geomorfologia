<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" font-family="Arial, sans-serif">
  <rect width="700" height="420" fill="#ffffff"/>
  <text x="350" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#333333">Cuenca hidrográfica y divisoria de aguas</text>

  <path d="M 350 40 Q 150 90 100 220 Q 80 320 200 380 Q 350 410 500 380 Q 620 320 600 220 Q 550 90 350 40 Z" fill="#d8e8d0" stroke="#2ca02c" stroke-width="3" stroke-dasharray="8 4"/>
  <text x="350" y="65" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a6b1a">Divisoria de aguas (watershed divide)</text>

  <!-- drainage network -->
  <path d="M 350 90 Q 340 150 320 200 Q 300 250 280 300 Q 260 340 250 370" fill="none" stroke="#1f6feb" stroke-width="3"/>
  <path d="M 250 200 Q 280 230 320 200" fill="none" stroke="#1f6feb" stroke-width="2"/>
  <path d="M 200 160 Q 260 190 300 170" fill="none" stroke="#1f6feb" stroke-width="2"/>
  <path d="M 430 150 Q 370 200 320 220" fill="none" stroke="#1f6feb" stroke-width="2"/>
  <path d="M 450 250 Q 380 270 290 290" fill="none" stroke="#1f6feb" stroke-width="2"/>

  <circle cx="250" cy="370" r="7" fill="#d62728"/>
  <text x="260" y="395" font-size="12" font-weight="bold" fill="#d62728">Punto de salida (outlet)</text>

  <text x="350" y="410" text-anchor="middle" font-size="10" fill="#666666">Toda la precipitación dentro de la divisoria drena hacia el mismo punto de salida</text>
</svg>
