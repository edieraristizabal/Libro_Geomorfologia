<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="Arial, sans-serif">
  <rect width="800" height="380" fill="#ffffff"/>

  <!-- Panel divider -->
  <line x1="400" y1="10" x2="400" y2="370" stroke="#cccccc" stroke-width="1"/>

  <!-- LEFT PANEL: Deflación -->
  <text x="30" y="35" font-size="20" font-weight="bold" fill="#333333">Deflación</text>
  <line x1="30" y1="260" x2="370" y2="260" stroke="#5c4326" stroke-width="3"/>
  <!-- mixed sediment before -->
  <text x="30" y="60" font-size="13" fill="#666666">Sedimento mixto (finos + gravas)</text>
  <g fill="#c2a878">
    <circle cx="50" cy="245" r="5"/><circle cx="70" cy="250" r="4"/><circle cx="90" cy="243" r="6"/>
    <circle cx="115" cy="248" r="4"/><circle cx="140" cy="244" r="5"/><circle cx="165" cy="249" r="4"/>
    <circle cx="190" cy="245" r="6"/><circle cx="215" cy="250" r="4"/>
  </g>
  <g fill="#7d7d7d" stroke="#4d4d4d">
    <circle cx="60" cy="255" r="8"/><circle cx="105" cy="256" r="9"/><circle cx="155" cy="255" r="7"/>
    <circle cx="200" cy="257" r="8"/><circle cx="240" cy="255" r="9"/><circle cx="280" cy="256" r="7"/>
  </g>
  <!-- wind removing fines -->
  <line x1="30" y1="150" x2="90" y2="150" stroke="#1f6feb" stroke-width="3" marker-end="url(#arrowD)"/>
  <text x="30" y="140" fill="#1f6feb" font-size="13">Viento</text>
  <text x="150" y="150" fill="#1f6feb" font-size="13">se lleva finos (limo, arena) →</text>
  <path d="M120 200 q40 -60 90 -70" stroke="#2ca02c" stroke-width="2" fill="none" stroke-dasharray="5 4" marker-end="url(#arrowD2)"/>

  <!-- after: desert pavement -->
  <text x="30" y="200" font-size="13" fill="#666666">Resultado: pavimento desértico</text>
  <g fill="#7d7d7d" stroke="#4d4d4d">
    <circle cx="330" cy="255" r="9"/>
  </g>
  <line x1="30" y1="290" x2="370" y2="290" stroke="#5c4326" stroke-width="3"/>
  <g fill="#7d7d7d" stroke="#4d4d4d" stroke-width="1.5">
    <circle cx="45" cy="282" r="10"/><circle cx="68" cy="284" r="9"/><circle cx="92" cy="281" r="11"/>
    <circle cx="118" cy="283" r="9"/><circle cx="144" cy="282" r="10"/><circle cx="170" cy="284" r="9"/>
    <circle cx="196" cy="281" r="10"/><circle cx="222" cy="283" r="9"/><circle cx="248" cy="282" r="11"/>
    <circle cx="276" cy="284" r="9"/><circle cx="302" cy="281" r="10"/><circle cx="330" cy="283" r="9"/>
    <circle cx="356" cy="282" r="10"/>
  </g>
  <text x="30" y="330" font-size="12" fill="#333333">Cantos y gravas entrelazados protegen el material subyacente</text>

  <!-- RIGHT PANEL: Abrasión -->
  <text x="430" y="35" font-size="20" font-weight="bold" fill="#333333">Abrasión eólica</text>
  <!-- rock -->
  <path d="M540 260 L560 150 L610 140 L650 200 L660 260 Z" fill="#a89a8a" stroke="#5c4326" stroke-width="2"/>
  <line x1="430" y1="260" x2="770" y2="260" stroke="#5c4326" stroke-width="3"/>

  <!-- sand grains hitting rock, low trajectory (first meter) -->
  <g stroke="#d62728" stroke-width="2" fill="none">
    <path d="M430 240 Q 490 200 540 220" marker-end="url(#arrowA)"/>
    <path d="M430 250 Q 480 235 540 240" marker-end="url(#arrowA)"/>
    <path d="M430 255 Q 470 250 540 252" marker-end="url(#arrowA)"/>
  </g>
  <text x="430" y="220" fill="#d62728" font-size="13">Partículas en saltación</text>
  <text x="430" y="205" fill="#d62728" font-size="12">(máxima efectividad en el primer metro)</text>

  <!-- facets on rock (ventifact) -->
  <line x1="540" y1="220" x2="600" y2="205" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="2 2"/>
  <line x1="540" y1="240" x2="600" y2="230" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="2 2"/>
  <text x="540" y="290" font-size="12" fill="#333333">Roca facetada y pulida (ventifacto)</text>

  <defs>
    <marker id="arrowD" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1f6feb"/>
    </marker>
    <marker id="arrowD2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2ca02c"/>
    </marker>
    <marker id="arrowA" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d62728"/>
    </marker>
  </defs>
</svg>
