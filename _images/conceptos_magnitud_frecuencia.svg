<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 460" font-family="Arial, sans-serif">
  <rect width="700" height="460" fill="#ffffff"/>
  <text x="350" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#333333">Relación magnitud - frecuencia - trabajo geomórfico</text>

  <line x1="90" y1="400" x2="650" y2="400" stroke="#333333" stroke-width="2" marker-end="url(#axm)"/>
  <line x1="90" y1="400" x2="90" y2="50" stroke="#333333" stroke-width="2" marker-end="url(#axm)"/>
  <text x="370" y="435" text-anchor="middle" font-size="13" font-weight="bold" fill="#333333">Magnitud del evento →</text>
  <text x="45" y="220" text-anchor="middle" font-size="13" font-weight="bold" fill="#333333" transform="rotate(-90 45 220)">Frecuencia / Trabajo geomórfico →</text>

  <!-- Frequency curve: decays as magnitude increases -->
  <path d="M 100 70 Q 200 90 300 220 Q 400 320 640 385" fill="none" stroke="#1f6feb" stroke-width="3"/>
  <text x="500" y="330" fill="#1f6feb" font-size="13" font-weight="bold">Frecuencia</text>

  <!-- Geomorphic work hump curve peaking at moderate-frequent events -->
  <path d="M 100 395 Q 220 150 320 130 Q 420 150 640 395" fill="none" stroke="#d62728" stroke-width="3"/>
  <text x="230" y="120" fill="#d62728" font-size="13" font-weight="bold">Trabajo geomórfico total</text>

  <line x1="320" y1="130" x2="320" y2="400" stroke="#999999" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="325" y="415" font-size="11" fill="#555555">evento moderado-frecuente</text>

  <text x="600" y="70" font-size="11" fill="#555555" text-anchor="end">evento catastrófico raro</text>
  <text x="120" y="415" font-size="11" fill="#555555">evento pequeño</text>

  <defs>
    <marker id="axm" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#333333"/>
    </marker>
  </defs>
</svg>
