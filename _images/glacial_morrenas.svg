<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 340" font-family="Arial, sans-serif">
  <rect width="700" height="340" fill="#ffffff"/>
  <text x="350" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#333333">Tipos de morrenas</text>

  <!-- valley walls -->
  <path d="M 40 300 L 140 60 L 180 60 L 260 300 Z" fill="#d8d8d8" opacity="0.6"/>
  <path d="M 440 300 L 520 60 L 560 60 L 660 300 Z" fill="#d8d8d8" opacity="0.6"/>

  <!-- glacier ice -->
  <path d="M 200 90 Q 350 130 500 90 L 500 260 Q 350 300 200 260 Z" fill="#cfe8f5" opacity="0.85"/>

  <!-- lateral moraines -->
  <path d="M 190 90 L 210 260" stroke="#8a6a45" stroke-width="10" stroke-linecap="round"/>
  <path d="M 510 90 L 490 260" stroke="#8a6a45" stroke-width="10" stroke-linecap="round"/>
  <text x="150" y="180" font-size="10" fill="#333333" text-anchor="middle">Lateral</text>
  <text x="560" y="180" font-size="10" fill="#333333" text-anchor="middle">Lateral</text>

  <!-- medial moraine -->
  <path d="M 350 90 L 350 260" stroke="#5c4326" stroke-width="8" stroke-linecap="round"/>
  <text x="380" y="150" font-size="10" fill="#333333">Central (medial)</text>

  <!-- terminal moraine -->
  <path d="M 200 300 Q 350 340 500 300 L 500 320 Q 350 355 200 320 Z" fill="#8a6a45"/>
  <text x="350" y="335" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">Terminal (frontal)</text>

  <!-- ground moraine hatching -->
  <g stroke="#8a6a45" stroke-width="1.5" opacity="0.7">
    <line x1="220" y1="270" x2="235" y2="280"/>
    <line x1="260" y1="270" x2="275" y2="280"/>
    <line x1="300" y1="270" x2="315" y2="280"/>
  </g>
  <text x="230" y="255" font-size="9" fill="#555555">morrena de fondo</text>
</svg>
