<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 340" font-family="Arial, sans-serif">
  <rect width="700" height="340" fill="#ffffff"/>
  <text x="350" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#333333">Geoformas asociadas a fallas de rumbo</text>

  <line x1="40" y1="170" x2="660" y2="170" stroke="#333333" stroke-width="2" stroke-dasharray="6 3"/>

  <!-- offset stream -->
  <path d="M 100 60 Q 110 150 150 170" stroke="#1f6feb" stroke-width="3" fill="none"/>
  <path d="M 150 170 Q 190 190 200 280" stroke="#1f6feb" stroke-width="3" fill="none"/>
  <text x="90" y="50" font-size="10" fill="#1f6feb">drenaje desplazado</text>

  <!-- shutter ridge -->
  <rect x="270" y="140" width="60" height="60" fill="#c9a06a" stroke="#6b4020" stroke-width="1.5" transform="rotate(-10 300 170)"/>
  <text x="240" y="120" font-size="10" fill="#333333">lomo de obturación</text>

  <!-- sag pond -->
  <ellipse cx="420" cy="175" rx="30" ry="14" fill="#7fb3d5" stroke="#4472a8" stroke-width="1"/>
  <text x="380" y="210" font-size="10" fill="#333333">hondonada de hundimiento</text>

  <!-- pressure ridge -->
  <polygon points="520,190 560,140 600,190" fill="#a97a50" stroke="#6b4020" stroke-width="1.5"/>
  <text x="490" y="120" font-size="10" fill="#333333">lomo de presión</text>

  <!-- fault saddle -->
  <path d="M 60 90 Q 90 60 120 90" fill="none" stroke="#8c6a45" stroke-width="8"/>
  <path d="M 60 90 Q 75 100 90 92" fill="none" stroke="#ffffff" stroke-width="6"/>
  <text x="30" y="260" font-size="10" fill="#333333">(collado/boquerón en la cresta cortada por la falla)</text>
</svg>
