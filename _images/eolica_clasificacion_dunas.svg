<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" font-family="Arial, sans-serif">
  <rect width="760" height="560" fill="#ffffff"/>
  <text x="380" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#333333">Clasificación de dunas según disponibilidad de arena y direccionalidad del viento</text>

  <!-- Axes -->
  <line x1="140" y1="490" x2="700" y2="490" stroke="#333333" stroke-width="2" marker-end="url(#axArrow)"/>
  <line x1="140" y1="490" x2="140" y2="70" stroke="#333333" stroke-width="2" marker-end="url(#axArrow)"/>
  <text x="420" y="525" text-anchor="middle" font-size="15" font-weight="bold" fill="#333333">Disponibilidad de arena →</text>
  <text x="60" y="280" text-anchor="middle" font-size="15" font-weight="bold" fill="#333333" transform="rotate(-90 60 280)">Direccionalidad del viento →</text>
  <text x="160" y="510" font-size="12" fill="#555555">Limitada</text>
  <text x="640" y="510" font-size="12" fill="#555555">Abundante</text>
  <text x="120" y="480" font-size="12" fill="#555555" text-anchor="end">Unidireccional</text>
  <text x="120" y="90" font-size="12" fill="#555555" text-anchor="end">Multidireccional</text>

  <!-- Barchan: low sand, unidirectional -->
  <g transform="translate(230,420)">
    <path d="M -70 20 Q -70 -35 0 -35 Q -25 -10 -25 20 Q 0 5 25 20 Q 25 -10 0 -35 Q 70 -35 70 20 Z" fill="#e0b97d" stroke="#8a6a3a" stroke-width="2"/>
    <text x="0" y="45" text-anchor="middle" font-size="13" font-weight="bold" fill="#333333">Barján</text>
  </g>

  <!-- Transverse: abundant sand, unidirectional -->
  <g transform="translate(560,420)">
    <path d="M -90 20 Q -60 -30 -30 20 Q 0 -30 30 20 Q 60 -30 90 20 Z" fill="#e0b97d" stroke="#8a6a3a" stroke-width="2"/>
    <text x="0" y="45" text-anchor="middle" font-size="13" font-weight="bold" fill="#333333">Transversal</text>
  </g>

  <!-- Longitudinal/seif: limited sand, bidirectional (mid height) -->
  <g transform="translate(230,255)">
    <path d="M -90 15 L 90 -15 L 90 -2 L -90 28 Z" fill="#e0b97d" stroke="#8a6a3a" stroke-width="2"/>
    <text x="0" y="45" text-anchor="middle" font-size="13" font-weight="bold" fill="#333333">Longitudinal (seif)</text>
  </g>

  <!-- Parabolic: limited-moderate sand, unidirectional + vegetation (place near barchan column, upper) -->
  <g transform="translate(230,140)">
    <path d="M -70 -10 Q -70 40 -20 30 Q -35 5 0 -20 Q 35 5 20 30 Q 70 40 70 -10 Z" fill="#e0b97d" stroke="#8a6a3a" stroke-width="2"/>
    <text x="0" y="55" text-anchor="middle" font-size="13" font-weight="bold" fill="#333333">Parabólica (con vegetación)</text>
  </g>

  <!-- Star: abundant sand, multidirectional -->
  <g transform="translate(560,150)">
    <path d="M0,-45 L12,-12 L45,0 L12,12 L0,45 L-12,12 L-45,0 L-12,-12 Z" fill="#e0b97d" stroke="#8a6a3a" stroke-width="2"/>
    <text x="0" y="65" text-anchor="middle" font-size="13" font-weight="bold" fill="#333333">Estrella</text>
  </g>

  <defs>
    <marker id="axArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#333333"/>
    </marker>
  </defs>
</svg>
