<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 280" font-family="Arial, sans-serif">
  <rect width="660" height="280" fill="#ffffff"/>

  <g transform="translate(20,20)">
    <text x="140" y="0" text-anchor="middle" font-size="13" font-weight="bold" fill="#333333">Suelo In Situ (Residual)</text>
    <rect x="60" y="60" width="160" height="30" fill="#4a3520"/>
    <rect x="60" y="90" width="160" height="50" fill="#a0764a"/>
    <rect x="60" y="140" width="160" height="50" fill="#8a7256"/>
    <rect x="60" y="190" width="160" height="40" fill="#6b6b6b"/>
    <text x="140" y="245" text-anchor="middle" font-size="10" fill="#555555">transición gradual suelo→roca</text>
  </g>

  <g transform="translate(360,20)">
    <text x="140" y="0" text-anchor="middle" font-size="13" font-weight="bold" fill="#333333">Suelo Transportado</text>
    <rect x="60" y="60" width="160" height="60" fill="#c9a06a"/>
    <text x="140" y="95" text-anchor="middle" font-size="9" fill="#333333">material aluvial/coluvial/eólico</text>
    <line x1="60" y1="120" x2="220" y2="120" stroke="#d62728" stroke-width="2" stroke-dasharray="4 3"/>
    <text x="225" y="118" font-size="9" fill="#d62728">contacto abrupto</text>
    <rect x="60" y="120" width="160" height="70" fill="#8a7256"/>
    <rect x="60" y="190" width="160" height="40" fill="#6b6b6b"/>
    <text x="140" y="245" text-anchor="middle" font-size="10" fill="#555555">material parental ajeno a la roca base</text>
  </g>
</svg>
