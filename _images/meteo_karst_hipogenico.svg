<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 340" font-family="Arial, sans-serif">
  <rect width="620" height="340" fill="#ffffff"/>
  <text x="310" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#333333">Karst epigénico vs. hipogénico</text>

  <g transform="translate(20,40)">
    <text x="130" y="0" text-anchor="middle" font-size="12" font-weight="bold" fill="#333333">Epigénico (normal)</text>
    <rect x="20" y="30" width="220" height="220" fill="#c9c2b6"/>
    <line x1="130" y1="10" x2="130" y2="60" stroke="#1f6feb" stroke-width="3" marker-end="url(#khArrow)"/>
    <text x="130" y="8" text-anchor="middle" font-size="9" fill="#1f6feb">agua meteórica (lluvia)</text>
    <path d="M 90 80 Q 130 130 100 200 Q 140 230 170 250" fill="none" stroke="#7fb3d5" stroke-width="6"/>
    <text x="130" y="270" text-anchor="middle" font-size="9" fill="#555555">disuelve desde la superficie hacia abajo</text>
  </g>

  <g transform="translate(340,40)">
    <text x="130" y="0" text-anchor="middle" font-size="12" font-weight="bold" fill="#333333">Hipogénico</text>
    <rect x="20" y="30" width="220" height="220" fill="#c9c2b6"/>
    <line x1="130" y1="270" x2="130" y2="225" stroke="#d62728" stroke-width="3" marker-end="url(#khArrow2)"/>
    <text x="130" y="285" text-anchor="middle" font-size="9" fill="#d62728">fluidos profundos, ácidos (ej. H₂S)</text>
    <ellipse cx="130" cy="140" rx="60" ry="40" fill="#8a8a8a"/>
    <text x="130" y="145" text-anchor="middle" font-size="9" fill="#ffffff">cueva</text>
  </g>

  <defs>
    <marker id="khArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1f6feb"/></marker>
    <marker id="khArrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#d62728"/></marker>
  </defs>
</svg>
