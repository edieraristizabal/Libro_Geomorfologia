<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="Arial, sans-serif">
  <rect width="720" height="300" fill="#ffffff"/>

  <g transform="translate(20,20)">
    <text x="160" y="0" text-anchor="middle" font-size="13" font-weight="bold" fill="#333333">Deslizamiento Rotacional</text>
    <path d="M 20 240 L 340 240 L 340 60 L 250 60 Z" fill="#d8d8d8"/>
    <path d="M 60 240 Q 100 130 250 100" fill="none" stroke="#d62728" stroke-width="3"/>
    <path d="M 60 240 Q 100 130 250 100 L 250 60 L 40 240 Z" fill="#a97a50" opacity="0.7"/>
    <path d="M 130 145 A 90 90 0 0 1 100 210" fill="none" stroke="#333333" stroke-width="1.5" stroke-dasharray="3 2"/>
    <text x="160" y="270" text-anchor="middle" font-size="10" fill="#555555">superficie cóncava, rotación — suelos homogéneos</text>
  </g>

  <g transform="translate(380,20)">
    <text x="160" y="0" text-anchor="middle" font-size="13" font-weight="bold" fill="#333333">Deslizamiento Traslacional</text>
    <path d="M 20 240 L 340 240 L 340 60 L 250 60 Z" fill="#d8d8d8"/>
    <path d="M 50 220 L 300 100" fill="none" stroke="#d62728" stroke-width="3"/>
    <path d="M 50 220 L 300 100 L 250 60 L 40 200 Z" fill="#a97a50" opacity="0.7"/>
    <text x="160" y="270" text-anchor="middle" font-size="10" fill="#555555">superficie plana — sigue discontinuidades geológicas</text>
  </g>
</svg>
