<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 280" font-family="Arial, sans-serif">
  <rect width="620" height="280" fill="#ffffff"/>
  <text x="310" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#333333">Horsts y Grabens</text>

  <rect x="40" y="140" width="120" height="90" fill="#c9a06a" stroke="#6b4020" stroke-width="2"/>
  <rect x="160" y="190" width="120" height="40" fill="#a97a50" stroke="#6b4020" stroke-width="2"/>
  <rect x="280" y="130" width="120" height="100" fill="#c9a06a" stroke="#6b4020" stroke-width="2"/>
  <rect x="400" y="190" width="120" height="40" fill="#a97a50" stroke="#6b4020" stroke-width="2"/>
  <rect x="520" y="140" width="60" height="90" fill="#c9a06a" stroke="#6b4020" stroke-width="2"/>

  <!-- fault lines -->
  <g stroke="#333333" stroke-width="1.5" stroke-dasharray="3 2">
    <line x1="160" y1="130" x2="160" y2="240"/>
    <line x1="280" y1="120" x2="280" y2="240"/>
    <line x1="400" y1="180" x2="400" y2="240"/>
    <line x1="520" y1="130" x2="520" y2="240"/>
  </g>

  <text x="100" y="120" text-anchor="middle" font-size="12" font-weight="bold" fill="#333333">Horst</text>
  <text x="220" y="180" text-anchor="middle" font-size="12" font-weight="bold" fill="#333333">Graben</text>
  <text x="340" y="110" text-anchor="middle" font-size="12" font-weight="bold" fill="#333333">Horst</text>
  <text x="460" y="180" text-anchor="middle" font-size="12" font-weight="bold" fill="#333333">Graben</text>

  <text x="310" y="265" text-anchor="middle" font-size="11" fill="#666666">Bloques elevados (horst) y hundidos (graben) limitados por fallas normales</text>
</svg>
