<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" font-family="Arial, sans-serif">
  <rect width="700" height="380" fill="#ffffff"/>
  <text x="350" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#333333">Rutas del agua de lluvia hacia el canal</text>

  <!-- rain -->
  <line x1="150" y1="40" x2="140" y2="70" stroke="#1f6feb" stroke-width="2"/>
  <line x1="180" y1="40" x2="170" y2="70" stroke="#1f6feb" stroke-width="2"/>
  <line x1="210" y1="40" x2="200" y2="70" stroke="#1f6feb" stroke-width="2"/>

  <!-- canopy -->
  <ellipse cx="180" cy="90" rx="60" ry="25" fill="#2ca02c" opacity="0.5"/>
  <text x="270" y="85" font-size="11" fill="#1a6b1a">1. Interceptación (evapora)</text>

  <!-- soil layers -->
  <rect x="40" y="120" width="620" height="30" fill="#8a7256"/>
  <text x="580" y="140" font-size="10" fill="#ffffff">suelo</text>
  <rect x="40" y="150" width="620" height="60" fill="#a89a8a"/>
  <rect x="40" y="210" width="620" height="80" fill="#6b6b6b"/>
  <text x="580" y="255" font-size="10" fill="#ffffff">acuífero</text>

  <!-- infiltration arrow -->
  <line x1="180" y1="115" x2="180" y2="145" stroke="#1f6feb" stroke-width="2.5" marker-end="url(#waArrow)"/>
  <text x="200" y="130" font-size="10" fill="#1f6feb">2. Infiltración</text>

  <!-- overland flow -->
  <line x1="300" y1="120" x2="450" y2="120" stroke="#d62728" stroke-width="3" marker-end="url(#waArrow2)"/>
  <text x="300" y="112" font-size="10" fill="#d62728">3. Escorrentía superficial (overland)</text>

  <!-- throughflow -->
  <line x1="220" y1="180" x2="420" y2="180" stroke="#e67e22" stroke-width="3" marker-end="url(#waArrow3)"/>
  <text x="230" y="200" font-size="10" fill="#e67e22">4. Flujo subsuperficial (throughflow)</text>

  <!-- deep groundwater flow -->
  <line x1="220" y1="260" x2="500" y2="260" stroke="#333333" stroke-width="2.5" marker-end="url(#waArrow4)"/>
  <text x="230" y="280" font-size="10" fill="#333333">5. Flujo profundo (agua subterránea, lento)</text>

  <!-- river -->
  <rect x="600" y="100" width="30" height="200" fill="#4472a8"/>
  <text x="615" y="330" text-anchor="middle" font-size="11" font-weight="bold" fill="#333333">Río</text>

  <defs>
    <marker id="waArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1f6feb"/></marker>
    <marker id="waArrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#d62728"/></marker>
    <marker id="waArrow3" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#e67e22"/></marker>
    <marker id="waArrow4" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#333333"/></marker>
  </defs>
</svg>
