<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 260" font-family="Arial, sans-serif">
  <rect width="840" height="260" fill="#ffffff"/>
  <text x="420" y="22" text-anchor="middle" font-size="15" font-weight="bold" fill="#333333">Progresión de la erosión pluvial en laderas</text>

  <!-- 1 splash -->
  <g transform="translate(20,50)">
    <text x="90" y="0" text-anchor="middle" font-size="12" font-weight="bold" fill="#333333">1. Splash</text>
    <circle cx="90" cy="60" r="6" fill="#1f6feb"/>
    <path d="M 90 66 L 90 90" stroke="#1f6feb" stroke-width="1.5" stroke-dasharray="2 2"/>
    <ellipse cx="90" cy="100" rx="30" ry="8" fill="#8a6a45" opacity="0.6"/>
    <path d="M 60 100 L 40 90 M 120 100 L 140 90 M 90 108 L 90 120" stroke="#8a6a45" stroke-width="1.5"/>
    <text x="90" y="150" text-anchor="middle" font-size="9" fill="#555555">impacto de gota, desagregación</text>
  </g>

  <!-- 2 sheet -->
  <g transform="translate(220,50)">
    <text x="90" y="0" text-anchor="middle" font-size="12" font-weight="bold" fill="#333333">2. Laminar (sheet)</text>
    <rect x="30" y="90" width="120" height="10" fill="#7fb3d5" opacity="0.8"/>
    <line x1="30" y1="95" x2="150" y2="95" stroke="#1f6feb" stroke-width="1" marker-end="url(#pgArrow)"/>
    <text x="90" y="150" text-anchor="middle" font-size="9" fill="#555555">flujo uniforme, remueve finos</text>
  </g>

  <!-- 3 rill -->
  <g transform="translate(440,50)">
    <text x="90" y="0" text-anchor="middle" font-size="12" font-weight="bold" fill="#333333">3. Surcos (rills)</text>
    <path d="M 40 90 Q 60 110 50 140" stroke="#1f6feb" stroke-width="4" fill="none"/>
    <path d="M 90 85 Q 100 115 95 145" stroke="#1f6feb" stroke-width="4" fill="none"/>
    <path d="M 140 90 Q 130 115 135 140" stroke="#1f6feb" stroke-width="4" fill="none"/>
    <text x="90" y="170" text-anchor="middle" font-size="9" fill="#555555">canales pequeños, borrables por labranza</text>
  </g>

  <!-- 4 gully -->
  <g transform="translate(650,50)">
    <text x="90" y="0" text-anchor="middle" font-size="12" font-weight="bold" fill="#333333">4. Cárcava (gully)</text>
    <path d="M 40 70 Q 70 100 90 150 Q 100 170 140 175" fill="#8a6a45" opacity="0.8" stroke="#5c4326" stroke-width="1.5"/>
    <text x="90" y="200" text-anchor="middle" font-size="9" fill="#555555">incisión profunda, erosión remontante</text>
  </g>

  <line x1="0" y1="230" x2="840" y2="230" stroke="#cccccc" stroke-width="1"/>
  <path d="M 20 245 L 800 245" stroke="#333333" stroke-width="1.5" marker-end="url(#pgArrow2)"/>
  <text x="420" y="258" text-anchor="middle" font-size="10" fill="#666666">Concentración creciente del flujo de escorrentía</text>

  <defs>
    <marker id="pgArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1f6feb"/></marker>
    <marker id="pgArrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#333333"/></marker>
  </defs>
</svg>
