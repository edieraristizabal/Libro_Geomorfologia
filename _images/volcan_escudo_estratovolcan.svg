<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 280" font-family="Arial, sans-serif">
  <rect width="700" height="280" fill="#ffffff"/>

  <g transform="translate(20,20)">
    <text x="160" y="0" text-anchor="middle" font-size="13" font-weight="bold" fill="#333333">Volcán en Escudo</text>
    <path d="M 10 220 Q 160 60 310 220 Z" fill="#8c6a45" stroke="#5c4326" stroke-width="2"/>
    <text x="160" y="250" text-anchor="middle" font-size="11" fill="#555555">Pendiente suave (&lt;10°) — lava basáltica fluida</text>
  </g>

  <g transform="translate(370,20)">
    <text x="150" y="0" text-anchor="middle" font-size="13" font-weight="bold" fill="#333333">Estratovolcán</text>
    <path d="M 40 220 Q 100 90 150 40 Q 200 90 260 220 Z" fill="#7a5a3a" stroke="#5c4326" stroke-width="2"/>
    <path d="M 90 220 L 110 130 L 130 220 Z" fill="#5c4326" opacity="0.5"/>
    <path d="M 170 220 L 190 150 L 210 220 Z" fill="#5c4326" opacity="0.5"/>
    <text x="150" y="250" text-anchor="middle" font-size="11" fill="#555555">Pendiente empinada (15-30°) — lava + piroclastos</text>
  </g>
</svg>
