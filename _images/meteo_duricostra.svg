<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420" font-family="Arial, sans-serif">
  <rect width="780" height="420" fill="#ffffff"/>
  <text x="390" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#333333">Formación de duricostras (costras endurecidas)</text>

  <!-- water table fluctuation -->
  <g transform="translate(30,50)">
    <text x="150" y="0" text-anchor="middle" font-size="12" font-weight="bold" fill="#333333">Fluctuación del nivel freático</text>
    <rect x="20" y="30" width="260" height="180" fill="#e8d29a"/>
    <line x1="20" y1="90" x2="280" y2="90" stroke="#1f6feb" stroke-width="2" stroke-dasharray="5 3"/>
    <text x="285" y="94" font-size="9" fill="#1f6feb">nivel freático (lluvias): Fe móvil (Fe²⁺)</text>
    <line x1="20" y1="150" x2="280" y2="150" stroke="#e67e22" stroke-width="2" stroke-dasharray="5 3"/>
    <text x="285" y="154" font-size="9" fill="#e67e22">nivel freático (seca): Fe precipita (Fe³⁺)</text>
    <text x="150" y="225" text-anchor="middle" font-size="10" fill="#555555">Ciclo oxidación-precipitación cementa el suelo</text>
  </g>

  <!-- two pathways -->
  <g transform="translate(30,280)">
    <rect x="0" y="0" width="340" height="120" fill="#f5efe0" stroke="#8a6a45" stroke-width="1"/>
    <text x="170" y="20" text-anchor="middle" font-size="12" font-weight="bold" fill="#333333">1. Acumulación Relativa (lixiviación)</text>
    <text x="170" y="40" text-anchor="middle" font-size="10" fill="#555555">clima húmedo — se lava lo soluble</text>
    <text x="170" y="65" text-anchor="middle" font-size="11" fill="#333333">• Ferricreta (rica en Fe)</text>
    <text x="170" y="85" text-anchor="middle" font-size="11" fill="#333333">• Alcrete (rica en Al, bauxita)</text>
  </g>

  <g transform="translate(400,280)">
    <rect x="0" y="0" width="340" height="120" fill="#f5efe0" stroke="#8a6a45" stroke-width="1"/>
    <text x="170" y="20" text-anchor="middle" font-size="12" font-weight="bold" fill="#333333">2. Acumulación Absoluta (precipitación)</text>
    <text x="170" y="40" text-anchor="middle" font-size="10" fill="#555555">clima árido/semiárido — asciende y precipita</text>
    <text x="170" y="65" text-anchor="middle" font-size="11" fill="#333333">• Calcrete (carbonato de calcio)</text>
    <text x="170" y="85" text-anchor="middle" font-size="11" fill="#333333">• Silcrete (sílice)</text>
  </g>
</svg>
