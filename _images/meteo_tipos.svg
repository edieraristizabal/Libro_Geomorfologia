<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 220" font-family="Arial, sans-serif">
  <rect width="700" height="220" fill="#ffffff"/>
  <text x="350" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#333333">Tipos de meteorización</text>

  <g transform="translate(40,50)">
    <path d="M 40 40 L 60 100 L 20 100 Z" fill="#a89a8a" stroke="#5c4326" stroke-width="1.5"/>
    <path d="M 65 45 L 85 100 L 45 100 Z" fill="#c9a06a" stroke="#5c4326" stroke-width="1.5"/>
    <text x="60" y="130" text-anchor="middle" font-size="12" font-weight="bold" fill="#333333">Física</text>
    <text x="60" y="148" text-anchor="middle" font-size="10" fill="#555555">Desintegración</text>
  </g>

  <g transform="translate(280,50)">
    <circle cx="60" cy="70" r="35" fill="#7fb3d5" opacity="0.6"/>
    <text x="60" y="50" text-anchor="middle" font-size="18" fill="#1f6feb">H₂O</text>
    <text x="60" y="130" text-anchor="middle" font-size="12" font-weight="bold" fill="#333333">Química</text>
    <text x="60" y="148" text-anchor="middle" font-size="10" fill="#555555">Descomposición</text>
  </g>

  <g transform="translate(520,50)">
    <path d="M 60 40 Q 45 70 60 100 Q 75 70 60 40" fill="#2ca02c"/>
    <path d="M 50 60 Q 30 65 40 80" fill="none" stroke="#2ca02c" stroke-width="3"/>
    <path d="M 70 60 Q 90 65 80 80" fill="none" stroke="#2ca02c" stroke-width="3"/>
    <text x="60" y="130" text-anchor="middle" font-size="12" font-weight="bold" fill="#333333">Biológica</text>
    <text x="60" y="148" text-anchor="middle" font-size="10" fill="#555555">Raíces, ácidos orgánicos</text>
  </g>
</svg>
