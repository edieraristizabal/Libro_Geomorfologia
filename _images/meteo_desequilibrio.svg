<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 260" font-family="Arial, sans-serif">
  <rect width="700" height="260" fill="#ffffff"/>
  <text x="350" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#333333">Meteorización: desequilibrio termodinámico</text>

  <g transform="translate(20,50)">
    <rect x="0" y="120" width="200" height="60" fill="#8c6a45"/>
    <rect x="60" y="60" width="80" height="60" fill="#a0522d" stroke="#5c2f10" stroke-width="2"/>
    <text x="100" y="50" text-anchor="middle" font-size="11" font-weight="bold" fill="#333333">Roca ígnea/metamórfica</text>
    <text x="100" y="150" text-anchor="middle" font-size="10" fill="#ffffff">formada a alta T° y P°</text>
    <text x="100" y="200" text-anchor="middle" font-size="10" fill="#555555">(interior de la Tierra: estable)</text>
  </g>

  <line x1="260" y1="130" x2="360" y2="130" stroke="#333333" stroke-width="2.5" marker-end="url(#meArrow)"/>
  <text x="270" y="115" font-size="10" fill="#333333">levantamiento</text>
  <text x="270" y="150" font-size="10" fill="#333333">+ erosión</text>

  <g transform="translate(400,50)">
    <rect x="0" y="120" width="240" height="60" fill="#cfe8f5"/>
    <path d="M 40 120 Q 100 60 160 120 Z" fill="#a0522d" stroke="#5c2f10" stroke-width="2" opacity="0.6"/>
    <path d="M 40 120 Q 100 90 160 120 Z" fill="#c9a06a" opacity="0.9"/>
    <text x="120" y="50" text-anchor="middle" font-size="11" font-weight="bold" fill="#333333">Superficie terrestre</text>
    <text x="120" y="150" text-anchor="middle" font-size="10" fill="#333333">baja T°, baja P°, alta O₂, alta H₂O</text>
    <text x="120" y="200" text-anchor="middle" font-size="10" fill="#555555">(minerales inestables → arcillas)</text>
  </g>

  <defs>
    <marker id="meArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#333333"/></marker>
  </defs>
</svg>
