<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320" font-family="Arial, sans-serif">
  <rect width="700" height="320" fill="#ffffff"/>
  <text x="350" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#333333">Factor Longitud-Pendiente (LS) de la ladera</text>

  <g transform="translate(20,50)">
    <text x="140" y="0" text-anchor="middle" font-size="12" font-weight="bold" fill="#333333">Ladera corta / suave</text>
    <path d="M 20 220 L 260 220 L 260 100 L 20 180 Z" fill="#d8d8d8"/>
    <path d="M 40 200 Q 100 190 150 175" fill="none" stroke="#1f6feb" stroke-width="3" marker-end="url(#lsArrow1)"/>
    <text x="140" y="250" text-anchor="middle" font-size="10" fill="#555555">menor escorrentía acumulada</text>
  </g>

  <g transform="translate(370,20)">
    <text x="140" y="0" text-anchor="middle" font-size="12" font-weight="bold" fill="#333333">Ladera larga / empinada</text>
    <path d="M 20 250 L 300 250 L 300 60 L 20 210 Z" fill="#d8d8d8"/>
    <path d="M 30 220 Q 130 200 220 130 Q 260 100 280 75" fill="none" stroke="#d62728" stroke-width="3.5" marker-end="url(#lsArrow2)"/>
    <text x="150" y="280" text-anchor="middle" font-size="10" fill="#555555">mayor escorrentía y velocidad → más erosión</text>
  </g>

  <defs>
    <marker id="lsArrow1" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1f6feb"/></marker>
    <marker id="lsArrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#d62728"/></marker>
  </defs>
</svg>
