<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" font-family="Arial, sans-serif">
  <rect width="760" height="520" fill="#ffffff"/>
  <text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#333333">Relación entre escala espacial y escala temporal de los procesos geomorfológicos</text>

  <!-- Axes -->
  <line x1="110" y1="460" x2="720" y2="460" stroke="#333333" stroke-width="2" marker-end="url(#ax)"/>
  <line x1="110" y1="460" x2="110" y2="60" stroke="#333333" stroke-width="2" marker-end="url(#ax)"/>
  <text x="415" y="495" text-anchor="middle" font-size="14" font-weight="bold" fill="#333333">Escala temporal (segundos → millones de años) →</text>
  <text x="45" y="260" text-anchor="middle" font-size="14" font-weight="bold" fill="#333333" transform="rotate(-90 45 260)">Escala espacial (mm → miles de km) →</text>

  <!-- Trend band -->
  <path d="M 130 440 L 700 90 L 700 130 L 130 460 Z" fill="#cfe3f7" opacity="0.6"/>

  <!-- Data points along the trend -->
  <g font-size="11" fill="#333333">
    <circle cx="150" cy="435" r="6" fill="#d62728"/>
    <text x="160" y="432">Reptación de arena (saltación)</text>

    <circle cx="230" cy="400" r="6" fill="#d62728"/>
    <text x="240" y="397">Formación de un rill</text>

    <circle cx="310" cy="355" r="6" fill="#d62728"/>
    <text x="320" y="352">Deslizamiento / avenida torrencial</text>

    <circle cx="380" cy="320" r="6" fill="#d62728"/>
    <text x="390" y="317">Migración de meandro</text>

    <circle cx="460" cy="260" r="6" fill="#d62728"/>
    <text x="470" y="257">Evolución de una cárcava a cuenca</text>

    <circle cx="540" cy="200" r="6" fill="#d62728"/>
    <text x="465" y="197">Formación de una cuenca de drenaje</text>

    <circle cx="620" cy="140" r="6" fill="#d62728"/>
    <text x="450" y="137">Levantamiento de una cordillera (orogenia)</text>

    <circle cx="690" cy="95" r="6" fill="#d62728"/>
    <text x="500" y="92">Ciclo de tectónica de placas</text>
  </g>

  <text x="150" y="475" font-size="11" fill="#555555">segundos</text>
  <text x="330" y="475" font-size="11" fill="#555555">días-años</text>
  <text x="520" y="475" font-size="11" fill="#555555">10³-10⁶ años</text>
  <text x="660" y="475" font-size="11" fill="#555555">&gt;10⁷ años</text>

  <defs>
    <marker id="ax" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#333333"/>
    </marker>
  </defs>
</svg>
