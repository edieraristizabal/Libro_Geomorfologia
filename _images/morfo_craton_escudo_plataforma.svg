<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320" font-family="Arial, sans-serif">
  <rect width="700" height="320" fill="#ffffff"/>
  <text x="350" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#333333">Cratón: escudo y plataforma</text>

  <!-- Shield side -->
  <g>
    <rect x="40" y="150" width="260" height="120" fill="#c98a5e" stroke="#7a4a28" stroke-width="2"/>
    <path d="M 40 150 L 150 130 L 300 150 Z" fill="#c98a5e" stroke="#7a4a28" stroke-width="2"/>
    <text x="170" y="115" text-anchor="middle" font-size="13" font-weight="bold" fill="#333333">Escudo</text>
    <text x="170" y="300" text-anchor="middle" font-size="11" fill="#555555">Basamento cristalino</text>
    <text x="170" y="314" text-anchor="middle" font-size="11" fill="#555555">(Precámbrico) expuesto</text>
  </g>

  <!-- Platform side -->
  <g>
    <rect x="380" y="150" width="280" height="120" fill="#c98a5e" stroke="#7a4a28" stroke-width="2"/>
    <rect x="380" y="130" width="280" height="35" fill="#e8d29a" stroke="#7a4a28" stroke-width="1.5"/>
    <rect x="380" y="110" width="280" height="22" fill="#d9c184" stroke="#7a4a28" stroke-width="1.5"/>
    <text x="520" y="90" text-anchor="middle" font-size="13" font-weight="bold" fill="#333333">Plataforma</text>
    <text x="520" y="300" text-anchor="middle" font-size="11" fill="#555555">Basamento cubierto por rocas</text>
    <text x="520" y="314" text-anchor="middle" font-size="11" fill="#555555">sedimentarias subhorizontales</text>
  </g>

  <line x1="340" y1="60" x2="340" y2="290" stroke="#cccccc" stroke-width="1" stroke-dasharray="4 4"/>
</svg>
