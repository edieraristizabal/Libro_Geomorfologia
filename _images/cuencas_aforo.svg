<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 300" font-family="Arial, sans-serif">
  <rect width="620" height="300" fill="#ffffff"/>
  <text x="310" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#333333">Aforo de caudal: Q = A × V</text>

  <path d="M 80 80 Q 200 60 340 90 Q 460 110 560 100" fill="none" stroke="#5c4326" stroke-width="3"/>
  <path d="M 100 90 Q 200 200 340 190 Q 440 185 540 105 L 560 100 Q 460 130 340 110 Q 220 90 100 90 Z" fill="#7fb3d5" opacity="0.7"/>

  <g stroke="#1f6feb" stroke-width="1.5">
    <line x1="150" y1="100" x2="150" y2="150"/>
    <line x1="250" y1="105" x2="250" y2="185"/>
    <line x1="350" y1="105" x2="350" y2="175"/>
    <line x1="450" y1="105" x2="450" y2="140"/>
  </g>
  <text x="310" y="230" text-anchor="middle" font-size="11" fill="#333333">A = área de la sección transversal (medida en varios puntos)</text>

  <line x1="200" y1="60" x2="260" y2="60" stroke="#d62728" stroke-width="2.5" marker-end="url(#qArrow)"/>
  <text x="270" y="65" font-size="11" fill="#d62728">V = velocidad promedio del flujo</text>

  <text x="310" y="270" text-anchor="middle" font-size="13" font-weight="bold" fill="#333333">Q (m³/s) = A (m²) × V (m/s)</text>

  <defs>
    <marker id="qArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#d62728"/></marker>
  </defs>
</svg>
