<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" font-family="Arial, sans-serif">
  <rect width="700" height="360" fill="#ffffff"/>
  <text x="350" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#333333">Partes de un delta (sección transversal)</text>

  <rect x="0" y="220" width="700" height="120" fill="#7fb3d5" opacity="0.5"/>

  <!-- delta plain -->
  <path d="M 20 220 L 220 220 L 200 200 L 40 200 Z" fill="#8a7256"/>
  <text x="110" y="190" text-anchor="middle" font-size="11" font-weight="bold" fill="#333333">Plano de Delta</text>
  <text x="110" y="240" text-anchor="middle" font-size="9" fill="#ffffff">canales distributarios, ciénagas</text>

  <!-- delta front -->
  <path d="M 200 220 Q 260 240 300 280 L 260 300 Q 220 250 200 220 Z" fill="#c9a06a"/>
  <text x="330" y="250" font-size="11" font-weight="bold" fill="#333333">Frente de Delta</text>
  <text x="330" y="266" font-size="9" fill="#555555">arena, pendiente pronunciada</text>

  <!-- prodelta -->
  <path d="M 260 300 Q 400 320 650 330 L 650 340 Q 400 335 260 315 Z" fill="#5c4326"/>
  <text x="500" y="300" font-size="11" font-weight="bold" fill="#333333">Prodelta</text>
  <text x="500" y="316" font-size="9" fill="#555555">limos y arcillas, baja pendiente</text>

  <text x="350" y="20" text-anchor="middle" font-size="10" fill="#888888"></text>
</svg>
