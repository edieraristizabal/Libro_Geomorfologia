<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" font-family="Arial, sans-serif">
  <rect width="760" height="260" fill="#ffffff"/>

  <g transform="translate(10,20)">
    <text x="115" y="0" text-anchor="middle" font-size="13" font-weight="bold" fill="#333333">De Caída (Fall)</text>
    <path d="M 20 200 Q 80 130 130 100 Q 180 130 230 200 Z" fill="#7a5a3a"/>
    <path d="M 30 200 Q 90 135 130 106 Q 175 135 220 200 Z" fill="#c9a06a" opacity="0.9"/>
    <text x="115" y="225" text-anchor="middle" font-size="10" fill="#555555">Manto uniforme, bien seleccionado</text>
  </g>

  <g transform="translate(270,20)">
    <text x="115" y="0" text-anchor="middle" font-size="13" font-weight="bold" fill="#333333">De Oleada (Surge)</text>
    <path d="M 20 200 Q 80 130 130 100 Q 180 130 230 200 Z" fill="#7a5a3a"/>
    <path d="M 30 195 Q 100 175 220 195" fill="none" stroke="#e67e22" stroke-width="3"/>
    <path d="M 35 185 Q 100 165 210 185" fill="none" stroke="#e67e22" stroke-width="3"/>
    <text x="115" y="225" text-anchor="middle" font-size="10" fill="#555555">Capas finas, estratificación cruzada</text>
  </g>

  <g transform="translate(530,20)">
    <text x="115" y="0" text-anchor="middle" font-size="13" font-weight="bold" fill="#333333">De Flujo (Ignimbrita)</text>
    <path d="M 20 200 Q 80 130 130 100 Q 180 130 230 200 Z" fill="#7a5a3a"/>
    <path d="M 0 200 Q 60 150 130 165 Q 200 150 240 200 Z" fill="#8c6a45"/>
    <text x="115" y="225" text-anchor="middle" font-size="10" fill="#555555">Mal seleccionado, rellena valles</text>
  </g>
</svg>
