<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" font-family="Arial, sans-serif">
  <rect width="640" height="340" fill="#ffffff"/>
  <text x="320" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#333333">Balanza de Lane</text>

  <line x1="320" y1="60" x2="320" y2="140" stroke="#5c4326" stroke-width="6"/>
  <line x1="140" y1="140" x2="500" y2="140" stroke="#5c4326" stroke-width="8"/>
  <rect x="300" y="40" width="40" height="20" fill="#8a6a45"/>

  <!-- left pan -->
  <line x1="140" y1="140" x2="100" y2="220" stroke="#333333" stroke-width="2"/>
  <line x1="140" y1="140" x2="180" y2="220" stroke="#333333" stroke-width="2"/>
  <ellipse cx="140" cy="225" rx="60" ry="14" fill="#c9a06a" stroke="#6b4020" stroke-width="2"/>
  <text x="140" y="260" text-anchor="middle" font-size="14" font-weight="bold" fill="#333333">Qs · D</text>
  <text x="140" y="280" text-anchor="middle" font-size="10" fill="#555555">carga y tamaño de sedimento</text>

  <!-- right pan -->
  <line x1="500" y1="140" x2="460" y2="220" stroke="#333333" stroke-width="2"/>
  <line x1="500" y1="140" x2="540" y2="220" stroke="#333333" stroke-width="2"/>
  <ellipse cx="500" cy="225" rx="60" ry="14" fill="#7fb3d5" stroke="#1f6feb" stroke-width="2"/>
  <text x="500" y="260" text-anchor="middle" font-size="14" font-weight="bold" fill="#333333">Q · S</text>
  <text x="500" y="280" text-anchor="middle" font-size="10" fill="#555555">caudal y pendiente</text>

  <text x="320" y="320" text-anchor="middle" font-size="11" fill="#666666">Si un lado aumenta, el río ajusta pendiente, patrón o profundidad para restablecer el equilibrio</text>
</svg>
