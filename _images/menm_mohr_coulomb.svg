<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 380" font-family="Arial, sans-serif">
  <rect width="620" height="380" fill="#ffffff"/>
  <text x="310" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#333333">Criterio de falla de Mohr-Coulomb</text>

  <line x1="80" y1="320" x2="580" y2="320" stroke="#333333" stroke-width="2" marker-end="url(#mcArrow)"/>
  <line x1="80" y1="320" x2="80" y2="50" stroke="#333333" stroke-width="2" marker-end="url(#mcArrow)"/>
  <text x="330" y="355" text-anchor="middle" font-size="13" font-weight="bold" fill="#333333">Esfuerzo normal efectivo (σ'ₙ) →</text>
  <text x="40" y="185" text-anchor="middle" font-size="13" font-weight="bold" fill="#333333" transform="rotate(-90 40 185)">Resistencia al cortante (τf) →</text>

  <!-- failure envelope line -->
  <line x1="80" y1="270" x2="500" y2="90" stroke="#d62728" stroke-width="3"/>
  <text x="420" y="80" fill="#d62728" font-size="12" font-weight="bold">τf = c' + σ'ₙ tan(φ')</text>

  <!-- cohesion intercept -->
  <circle cx="80" cy="270" r="5" fill="#333333"/>
  <text x="20" y="265" font-size="12" font-weight="bold" fill="#333333">c'</text>

  <!-- friction angle -->
  <path d="M 130 270 A 50 50 0 0 0 155 230" fill="none" stroke="#1f6feb" stroke-width="1.5"/>
  <text x="150" y="255" font-size="12" fill="#1f6feb">φ'</text>

  <text x="330" y="140" font-size="10" fill="#2ca02c">Zona estable (por debajo de la envolvente)</text>
  <text x="150" y="120" font-size="10" fill="#d62728">Zona de falla (por encima)</text>
  <defs>
    <marker id="mcArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#333333"/></marker>
  </defs>
</svg>
