<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" font-family="Arial, sans-serif">
  <rect width="700" height="300" fill="#ffffff"/>
  <text x="350" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#333333">Mecanismos de pérdida de energía y detención</text>

  <g font-size="11" fill="#333333">
    <rect x="20" y="50" width="310" height="70" fill="#f5efe0" stroke="#8a6a45"/>
    <text x="175" y="75" text-anchor="middle" font-weight="bold">1. Disminución de la pendiente</text>
    <text x="175" y="95" text-anchor="middle" font-size="10">al llegar a abanicos aluviales o valles principales</text>

    <rect x="370" y="50" width="310" height="70" fill="#f5efe0" stroke="#8a6a45"/>
    <text x="525" y="75" text-anchor="middle" font-weight="bold">2. Pérdida de confinamiento</text>
    <text x="525" y="95" text-anchor="middle" font-size="10">expansión lateral fuera del canal</text>

    <rect x="20" y="140" width="310" height="70" fill="#f5efe0" stroke="#8a6a45"/>
    <text x="175" y="165" text-anchor="middle" font-weight="bold">3. Pérdida de agua (infiltración)</text>
    <text x="175" y="185" text-anchor="middle" font-size="10">aumenta la fricción interna</text>

    <rect x="370" y="140" width="310" height="70" fill="#f5efe0" stroke="#8a6a45"/>
    <text x="525" y="165" text-anchor="middle" font-weight="bold">4. Aumento de carga (bulking)</text>
    <text x="525" y="185" text-anchor="middle" font-size="10">mayor viscosidad, frena el flujo</text>
  </g>
</svg>
