<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="Arial, sans-serif">
  <rect width="640" height="380" fill="#ffffff"/>
  <text x="320" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#333333">Anatomía de un glaciar: balance de masa</text>

  <!-- mountain valley -->
  <path d="M 40 320 L 120 80 L 320 340 L 520 60 L 600 320 Z" fill="#d8d8d8" stroke="#999999" stroke-width="1"/>

  <!-- glacier tongue -->
  <path d="M 130 100 Q 250 200 330 340 L 250 340 Q 200 220 130 130 Z" fill="#cfe8f5" stroke="#7fb3d5" stroke-width="2"/>
  <path d="M 460 90 Q 380 220 300 340 L 380 340 Q 430 220 490 120 Z" fill="#cfe8f5" stroke="#7fb3d5" stroke-width="2"/>

  <line x1="60" y1="230" x2="600" y2="230" stroke="#d62728" stroke-width="2.5" stroke-dasharray="6 4"/>
  <text x="605" y="234" fill="#d62728" font-size="12" font-weight="bold">Línea de Equilibrio (EQL)</text>

  <text x="150" y="150" font-size="12" font-weight="bold" fill="#1f6feb">Zona de Acumulación</text>
  <text x="150" y="168" font-size="10" fill="#1f6feb">nieve invernal &gt; pérdida de hielo</text>

  <text x="330" y="300" font-size="12" font-weight="bold" fill="#e67e22">Zona de Ablación</text>
  <text x="330" y="318" font-size="10" fill="#e67e22">pérdida de hielo &gt; nieve invernal</text>
</svg>
