<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" font-family="Arial, sans-serif">
  <rect width="640" height="260" fill="#ffffff"/>
  <text x="320" y="22" text-anchor="middle" font-size="15" font-weight="bold" fill="#333333">Gelifracción (frost shattering)</text>

  <g transform="translate(40,50)">
    <text x="90" y="0" text-anchor="middle" font-size="11" font-weight="bold" fill="#333333">1. Agua se infiltra</text>
    <rect x="20" y="40" width="140" height="100" fill="#a89a8a" stroke="#5c4326" stroke-width="2"/>
    <path d="M 90 40 L 90 140" stroke="#1f6feb" stroke-width="3"/>
    <path d="M 80 45 L 90 55 L 100 45" fill="none" stroke="#1f6feb" stroke-width="2"/>
  </g>

  <g transform="translate(250,50)">
    <text x="90" y="0" text-anchor="middle" font-size="11" font-weight="bold" fill="#333333">2. Se congela y expande (~9%)</text>
    <rect x="20" y="40" width="140" height="100" fill="#a89a8a" stroke="#5c4326" stroke-width="2"/>
    <path d="M 88 40 L 92 140 M 82 60 L 98 65 M 84 100 L 100 95" stroke="#ffffff" stroke-width="3"/>
    <path d="M 84 45 L 96 45 L 90 40 Z" fill="#ffffff"/>
  </g>

  <g transform="translate(460,50)">
    <text x="90" y="0" text-anchor="middle" font-size="11" font-weight="bold" fill="#333333">3. La roca se fractura</text>
    <path d="M 20 40 L 85 40 L 80 140 L 20 140 Z" fill="#a89a8a" stroke="#5c4326" stroke-width="2"/>
    <path d="M 95 40 L 160 40 L 160 140 L 100 140 Z" fill="#a89a8a" stroke="#5c4326" stroke-width="2"/>
    <text x="90" y="160" text-anchor="middle" font-size="10" fill="#555555">gelifractos angulosos</text>
  </g>
</svg>
