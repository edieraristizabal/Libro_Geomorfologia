<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="Arial, sans-serif">
  <rect width="720" height="320" fill="#ffffff"/>
  <text x="360" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#333333">Isostasia: corteza continental vs. oceánica flotando sobre el manto</text>

  <rect x="0" y="180" width="720" height="120" fill="#d9822b" opacity="0.35"/>
  <text x="10" y="195" font-size="11" fill="#7a4a10">Manto (astenosfera)</text>

  <!-- continental block: thick, less dense, floats high with deep root -->
  <rect x="90" y="60" width="160" height="200" fill="#c9a06a" stroke="#6b4020" stroke-width="2"/>
  <text x="170" y="45" text-anchor="middle" font-size="12" font-weight="bold" fill="#333333">Corteza Continental</text>
  <text x="170" y="290" text-anchor="middle" font-size="10" fill="#555555">~2.7 g/cm³ — raíz profunda</text>

  <!-- oceanic block: thin, denser, floats low -->
  <rect x="420" y="150" width="200" height="60" fill="#8c7a6b" stroke="#4a3a2a" stroke-width="2"/>
  <text x="520" y="135" text-anchor="middle" font-size="12" font-weight="bold" fill="#333333">Corteza Oceánica</text>
  <text x="520" y="230" text-anchor="middle" font-size="10" fill="#555555">~3.0 g/cm³ — sin raíz profunda</text>

  <line x1="0" y1="180" x2="720" y2="180" stroke="#333333" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="660" y="175" font-size="10" fill="#333333">nivel de referencia</text>
</svg>
