<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 260" font-family="Arial, sans-serif">
  <rect width="700" height="260" fill="#ffffff"/>
  <text x="350" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#333333">Principio de esfuerzo efectivo (Terzaghi)</text>

  <g font-size="13" text-anchor="middle" fill="#333333">
    <rect x="30" y="80" width="150" height="70" fill="#8a7256" stroke="#5c4326" stroke-width="1.5"/>
    <text x="105" y="120" fill="#ffffff" font-weight="bold">σₙ</text>
    <text x="105" y="170">Esfuerzo Total</text>

    <text x="200" y="120" font-size="18">=</text>

    <rect x="230" y="80" width="150" height="70" fill="#c9a06a" stroke="#6b4020" stroke-width="1.5"/>
    <text x="305" y="120" font-weight="bold">σ'ₙ</text>
    <text x="305" y="170">Esfuerzo Efectivo</text>

    <text x="400" y="120" font-size="18">+</text>

    <rect x="430" y="80" width="150" height="70" fill="#7fb3d5" stroke="#1f6feb" stroke-width="1.5"/>
    <text x="505" y="120" font-weight="bold">u</text>
    <text x="505" y="170">Presión de Poros</text>
  </g>

  <text x="350" y="220" text-anchor="middle" font-size="12" fill="#333333">σ'ₙ = σₙ − u  →  si u aumenta (lluvia), σ'ₙ disminuye y la resistencia colapsa</text>
</svg>
