<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420" font-family="Arial, sans-serif">
  <rect width="780" height="420" fill="#ffffff"/>
  <text x="390" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#333333">Geoformas de la llanura de inundación</text>

  <rect x="20" y="50" width="740" height="340" fill="#e8d9b8"/>

  <!-- meandering channel -->
  <path d="M 40 300 Q 120 200 220 240 Q 300 270 280 340 Q 260 390 340 380 Q 420 370 400 300 Q 380 230 460 220 Q 560 210 560 150 Q 560 100 650 100" fill="none" stroke="#4472a8" stroke-width="18"/>

  <!-- natural levees along channel -->
  <path d="M 40 290 Q 120 190 220 230" fill="none" stroke="#8a6a45" stroke-width="6" opacity="0.8"/>
  <text x="90" y="180" font-size="10" font-weight="bold" fill="#333333">Dique Natural (levee)</text>

  <!-- oxbow lake -->
  <ellipse cx="330" cy="355" rx="55" ry="22" fill="#7fb3d5" stroke="#4472a8" stroke-width="2" transform="rotate(-15 330 355)"/>
  <text x="330" y="400" text-anchor="middle" font-size="10" font-weight="bold" fill="#333333">Meandro Abandonado (oxbow lake)</text>

  <!-- point bar -->
  <path d="M 230 250 Q 270 275 260 310 Q 230 320 205 300 Z" fill="#e2c98a" stroke="#8a6a45" stroke-width="1.5"/>
  <text x="150" y="270" font-size="10" font-weight="bold" fill="#333333">Barra de Meandro (point bar)</text>

  <!-- yazoo tributary -->
  <path d="M 620 60 Q 610 150 600 200 Q 590 250 630 260" fill="none" stroke="#2ca02c" stroke-width="4"/>
  <text x="640" y="150" font-size="10" font-weight="bold" fill="#1a6b1a">Tributario Yazoo</text>

  <!-- backswamp -->
  <text x="620" y="330" font-size="10" font-weight="bold" fill="#555555">Cubeta de inundación (backswamp)</text>
</svg>
