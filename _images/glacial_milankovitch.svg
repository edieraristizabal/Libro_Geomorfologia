<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 280" font-family="Arial, sans-serif">
  <rect width="820" height="280" fill="#ffffff"/>
  <text x="410" y="22" text-anchor="middle" font-size="15" font-weight="bold" fill="#333333">Ciclos de Milankovitch</text>

  <!-- Eccentricity -->
  <g transform="translate(20,40)">
    <text x="120" y="0" text-anchor="middle" font-size="12" font-weight="bold" fill="#333333">Excentricidad (~100 000 / 413 000 años)</text>
    <ellipse cx="120" cy="110" rx="100" ry="60" fill="none" stroke="#1f6feb" stroke-width="2"/>
    <ellipse cx="120" cy="110" rx="70" ry="65" fill="none" stroke="#999999" stroke-width="2" stroke-dasharray="4 3"/>
    <circle cx="120" cy="110" r="6" fill="#f1c40f"/>
    <text x="120" y="200" text-anchor="middle" font-size="10" fill="#555555">Cambia la forma de la órbita</text>
  </g>

  <!-- Obliquity -->
  <g transform="translate(300,40)">
    <text x="120" y="0" text-anchor="middle" font-size="12" font-weight="bold" fill="#333333">Oblicuidad (~41 000 años)</text>
    <circle cx="120" cy="120" r="60" fill="#a9c9e0" stroke="#1f6feb" stroke-width="2"/>
    <line x1="120" y1="60" x2="120" y2="180" stroke="#333333" stroke-width="1" stroke-dasharray="3 2"/>
    <line x1="95" y1="65" x2="145" y2="175" stroke="#d62728" stroke-width="2.5"/>
    <text x="150" y="80" font-size="10" fill="#d62728">22.1° - 24.5°</text>
    <text x="120" y="200" text-anchor="middle" font-size="10" fill="#555555">Cambia la inclinación del eje</text>
  </g>

  <!-- Precession -->
  <g transform="translate(580,40)">
    <text x="120" y="0" text-anchor="middle" font-size="12" font-weight="bold" fill="#333333">Precesión (~23 000 años)</text>
    <circle cx="120" cy="120" r="55" fill="#a9c9e0" stroke="#1f6feb" stroke-width="2"/>
    <line x1="120" y1="65" x2="120" y2="175" stroke="#d62728" stroke-width="2.5"/>
    <path d="M 120 65 A 55 55 0 0 1 165 100" fill="none" stroke="#2ca02c" stroke-width="2" marker-end="url(#precArrow)"/>
    <text x="120" y="200" text-anchor="middle" font-size="10" fill="#555555">"Bamboleo" del eje de rotación</text>
  </g>
  <defs>
    <marker id="precArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#2ca02c"/></marker>
  </defs>
</svg>
