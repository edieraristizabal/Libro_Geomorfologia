    <circle cx="18" cy="38" r="6" fill="#1f6feb"/>
    <text x="30" y="42">Orden 2 (confluencia de dos de orden 1)</text>
    <circle cx="18" cy="58" r="6" fill="#d62728"/>
    <text x="30" y="62">Orden 3 (confluencia de dos de orden 2)</text>
  </g>

  <text x="350" y="365" text-anchor="middle" font-size="10" fill="#666666">Elaboración propia con base en Strahler (1957)</text>
</svg>
