<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" font-family="Arial, sans-serif">
  <rect width="700" height="380" fill="#ffffff"/>
  <text x="350" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#333333">Órdenes de drenaje (Strahler)</text>

  <g stroke-linecap="round" fill="none">
    <path d="M 80 60 L 150 150" stroke="#7fb3d5" stroke-width="2.5"/>
    <path d="M 130 60 L 150 150" stroke="#7fb3d5" stroke-width="2.5"/>
    <path d="M 150 150 L 220 220" stroke="#1f6feb" stroke-width="4"/>
    <path d="M 260 70 L 220 220" stroke="#7fb3d5" stroke-width="2.5"/>
    <path d="M 300 100 L 260 220" stroke="#7fb3d5" stroke-width="2.5"/>
    <path d="M 260 220 L 220 220" stroke="#1f6feb" stroke-width="4"/>
    <path d="M 220 220 L 320 300" stroke="#d62728" stroke-width="6"/>
    <path d="M 420 90 L 470 180" stroke="#7fb3d5" stroke-width="2.5"/>
    <path d="M 460 90 L 470 180" stroke="#7fb3d5" stroke-width="2.5"/>
    <path d="M 470 180 L 500 240" stroke="#1f6feb" stroke-width="4"/>
    <path d="M 500 240 L 320 300" stroke="#d62728" stroke-width="6"/>
    <path d="M 320 300 L 300 350" stroke="#d62728" stroke-width="6"/>
  </g>

  <g font-size="11" fill="#333333">
    <circle cx="18" cy="18" r="6" fill="#7fb3d5"/>
