<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" font-family="Arial, sans-serif">
  <rect width="760" height="380" fill="#ffffff"/>

  <g transform="translate(20,20)">
    <text x="160" y="0" text-anchor="middle" font-size="13" font-weight="bold" fill="#333333">Cuenca Ovalada</text>
    <ellipse cx="160" cy="110" rx="130" ry="80" fill="#d8e8d0" stroke="#2ca02c" stroke-width="2"/>
    <circle cx="160" cy="110" r="5" fill="#d62728"/>
    <path d="M 60 60 L 160 110 M 260 60 L 160 110 M 60 160 L 160 110 M 260 160 L 160 110" stroke="#1f6feb" stroke-width="1.5"/>
    <text x="160" y="220" text-anchor="middle" font-size="10" fill="#555555">tributarios de longitud similar</text>

    <!-- hydrograph peaked -->
    <line x1="20" y1="320" x2="320" y2="320" stroke="#333333" stroke-width="1.5"/>
    <line x1="20" y1="320" x2="20" y2="250" stroke="#333333" stroke-width="1.5"/>
    <path d="M 30 315 Q 160 240 190 315 Q 250 318 300 316" fill="none" stroke="#d62728" stroke-width="2.5"/>
    <text x="160" y="345" text-anchor="middle" font-size="10" fill="#d62728" font-weight="bold">Respuesta rápida y picuda</text>
  </g>

  <g transform="translate(400,20)">
    <text x="160" y="0" text-anchor="middle" font-size="13" font-weight="bold" fill="#333333">Cuenca Alargada</text>
    <path d="M 40 110 Q 100 60 160 90 Q 220 70 280 110 Q 220 150 160 130 Q 100 160 40 110 Z" fill="#d8e8d0" stroke="#2ca02c" stroke-width="2"/>
    <circle cx="280" cy="110" r="5" fill="#d62728"/>
    <path d="M 50 105 L 280 110 M 90 75 L 280 110 M 150 95 L 280 110" stroke="#1f6feb" stroke-width="1.5"/>
    <text x="160" y="220" text-anchor="middle" font-size="10" fill="#555555">tributarios escalonados</text>

    <!-- hydrograph attenuated -->
    <line x1="20" y1="320" x2="320" y2="320" stroke="#333333" stroke-width="1.5"/>
    <line x1="20" y1="320" x2="20" y2="250" stroke="#333333" stroke-width="1.5"/>
    <path d="M 30 316 Q 120 280 180 285 Q 250 290 300 310" fill="none" stroke="#1f6feb" stroke-width="2.5"/>
    <text x="160" y="345" text-anchor="middle" font-size="10" fill="#1f6feb" font-weight="bold">Respuesta lenta y atenuada</text>
  </g>
</svg>
