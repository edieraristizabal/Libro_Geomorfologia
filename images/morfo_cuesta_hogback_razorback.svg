<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 300" font-family="Arial, sans-serif">
  <rect width="780" height="300" fill="#ffffff"/>

  <!-- Cuesta: gentle dip -->
  <g transform="translate(20,20)">
    <text x="115" y="0" text-anchor="middle" font-size="13" font-weight="bold" fill="#333333">Cuesta (buzamiento &lt;15-20°)</text>
    <line x1="0" y1="230" x2="230" y2="230" stroke="#333333" stroke-width="1"/>
    <path d="M 20 230 L 190 150 L 210 230 Z" fill="#c9a06a" stroke="#6b4020" stroke-width="2"/>
    <text x="200" y="145" font-size="10" fill="#d62728">escarpe</text>
    <text x="90" y="180" font-size="10" fill="#2ca02c">reverso suave</text>
  </g>

  <!-- Hogback: steep dip -->
  <g transform="translate(280,20)">
    <text x="115" y="0" text-anchor="middle" font-size="13" font-weight="bold" fill="#333333">Hogback (buzamiento &gt;30-40°)</text>
    <line x1="0" y1="230" x2="230" y2="230" stroke="#333333" stroke-width="1"/>
    <path d="M 60 230 L 130 130 L 200 230 Z" fill="#c9a06a" stroke="#6b4020" stroke-width="2"/>
    <text x="115" y="270" text-anchor="middle" font-size="10" fill="#555555">ambas laderas empinadas y similares</text>
  </g>

  <!-- Razorback: near vertical -->
  <g transform="translate(540,20)">
    <text x="115" y="0" text-anchor="middle" font-size="13" font-weight="bold" fill="#333333">Razorback (estratos ~verticales)</text>
    <line x1="0" y1="230" x2="230" y2="230" stroke="#333333" stroke-width="1"/>
    <path d="M 105 230 L 120 110 L 135 230 Z" fill="#c9a06a" stroke="#6b4020" stroke-width="2"/>
    <text x="115" y="270" text-anchor="middle" font-size="10" fill="#555555">cresta aguda y muy estrecha</text>
  </g>
</svg>
