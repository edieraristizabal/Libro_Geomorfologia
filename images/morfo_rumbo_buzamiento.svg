<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="Arial, sans-serif">
  <rect width="520" height="380" fill="#ffffff"/>
  <text x="260" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#333333">Rumbo (Strike) y Buzamiento (Dip)</text>

  <!-- inclined plane (parallelogram) -->
  <polygon points="80,280 400,280 460,140 140,140" fill="#d8c39a" stroke="#6b4020" stroke-width="2" opacity="0.9"/>

  <!-- strike line -->
  <line x1="120" y1="260" x2="420" y2="260" stroke="#1f6feb" stroke-width="3"/>
  <text x="430" y="264" fill="#1f6feb" font-size="12" font-weight="bold">Rumbo</text>

  <!-- north arrow -->
  <line x1="120" y1="330" x2="120" y2="290" stroke="#333333" stroke-width="1.5" marker-end="url(#nArrow)"/>
  <text x="112" y="345" font-size="11" fill="#333333">N</text>

  <!-- dip arrow (max slope direction, perpendicular to strike) -->
  <line x1="270" y1="260" x2="350" y2="170" stroke="#d62728" stroke-width="3" marker-end="url(#dArrow)"/>
  <text x="355" y="165" fill="#d62728" font-size="12" font-weight="bold">Buzamiento</text>

  <!-- dip angle arc -->
  <path d="M 270 260 A 40 40 0 0 0 300 230" fill="none" stroke="#333333" stroke-width="1.5"/>
  <text x="295" y="252" font-size="11" fill="#333333">δ</text>

  <!-- horizontal reference -->
  <line x1="270" y1="260" x2="380" y2="260" stroke="#999999" stroke-width="1.5" stroke-dasharray="4 3"/>

  <text x="260" y="360" text-anchor="middle" font-size="11" fill="#666666">El buzamiento es perpendicular al rumbo y mide la máxima inclinación del plano</text>

  <defs>
    <marker id="nArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#333333"/></marker>
    <marker id="dArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#d62728"/></marker>
  </defs>
</svg>
