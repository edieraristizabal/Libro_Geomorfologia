<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320" font-family="Arial, sans-serif">
  <rect width="700" height="320" fill="#ffffff"/>
  <text x="350" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#333333">Catena (toposecuencia) de suelos en una ladera</text>

  <path d="M 40 260 L 660 100 L 660 280 L 40 280 Z" fill="#e8d9b8" stroke="#6b4020" stroke-width="1"/>

  <!-- crest thin leached soil -->
  <rect x="60" y="105" width="90" height="18" fill="#a0764a" transform="rotate(-14 105 114)"/>
  <text x="70" y="95" font-size="10" font-weight="bold" fill="#333333">Cima: suelo delgado, lixiviado</text>

  <!-- midslope thicker, colluvium -->
  <rect x="280" y="165" width="110" height="35" fill="#8a6a45" transform="rotate(-14 335 182)"/>
  <text x="300" y="150" font-size="10" font-weight="bold" fill="#333333">Media ladera: perfil desarrollado + coluvión</text>

  <!-- base thick accumulation, hydromorphic -->
  <rect x="480" y="220" width="140" height="45" fill="#5c4326"/>
  <text x="490" y="210" font-size="10" font-weight="bold" fill="#333333">Base: suelos gruesos, hidromórficos</text>

  <line x1="40" y1="260" x2="660" y2="100" stroke="#333333" stroke-width="1" stroke-dasharray="3 3"/>
</svg>
