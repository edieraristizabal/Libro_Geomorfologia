<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 340" font-family="Arial, sans-serif">
  <rect width="780" height="340" fill="#ffffff"/>
  <text x="390" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#333333">Perfil de un margen continental pasivo</text>

  <!-- interior plateau -->
  <rect x="20" y="120" width="220" height="150" fill="#b9895f" stroke="#6b4020" stroke-width="2"/>
  <text x="130" y="105" text-anchor="middle" font-size="12" font-weight="bold" fill="#333333">Interior continental elevado</text>

  <!-- great escarpment -->
  <path d="M 240 120 L 320 260 L 240 270 Z" fill="#a97a50" stroke="#6b4020" stroke-width="2"/>
  <text x="330" y="180" font-size="12" font-weight="bold" fill="#333333">Gran Escarpe</text>

  <!-- coastal plain -->
  <rect x="320" y="255" width="300" height="20" fill="#e2c98a" stroke="#6b4020" stroke-width="1.5"/>
  <text x="470" y="245" text-anchor="middle" font-size="12" font-weight="bold" fill="#333333">Llanura Costera</text>

  <!-- ocean -->
  <rect x="620" y="230" width="140" height="45" fill="#7fb3d5"/>
  <text x="690" y="220" text-anchor="middle" font-size="11" fill="#333333">Océano</text>

  <text x="390" y="310" text-anchor="middle" font-size="11" fill="#666666">No corresponde a un borde de placa; resulta de la ruptura continental pasada (rifting)</text>
</svg>
