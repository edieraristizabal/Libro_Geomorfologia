<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 260" font-family="Arial, sans-serif">
  <rect width="780" height="260" fill="#ffffff"/>

  <!-- Compressive -->
  <g transform="translate(20,30)">
    <text x="115" y="0" text-anchor="middle" font-size="13" font-weight="bold" fill="#333333">Esfuerzo Compresivo</text>
    <rect x="60" y="60" width="110" height="70" fill="#c9a06a" stroke="#6b4020" stroke-width="2"/>
    <line x1="10" y1="95" x2="55" y2="95" stroke="#d62728" stroke-width="3" marker-end="url(#a1)"/>
    <line x1="220" y1="95" x2="175" y2="95" stroke="#d62728" stroke-width="3" marker-end="url(#a1)"/>
    <text x="115" y="155" text-anchor="middle" font-size="11" fill="#555555">Acortamiento → fallas inversas</text>
  </g>

  <!-- Tensional -->
  <g transform="translate(280,30)">
    <text x="115" y="0" text-anchor="middle" font-size="13" font-weight="bold" fill="#333333">Esfuerzo Tensional</text>
    <rect x="60" y="60" width="110" height="70" fill="#c9a06a" stroke="#6b4020" stroke-width="2"/>
    <line x1="60" y1="95" x2="15" y2="95" stroke="#1f6feb" stroke-width="3" marker-end="url(#a2)"/>
    <line x1="170" y1="95" x2="215" y2="95" stroke="#1f6feb" stroke-width="3" marker-end="url(#a2)"/>
    <text x="115" y="155" text-anchor="middle" font-size="11" fill="#555555">Alargamiento → fallas normales</text>
  </g>

  <!-- Shear -->
  <g transform="translate(540,30)">
    <text x="115" y="0" text-anchor="middle" font-size="13" font-weight="bold" fill="#333333">Esfuerzo de Cizalla</text>
    <rect x="60" y="60" width="110" height="70" fill="#c9a06a" stroke="#6b4020" stroke-width="2"/>
    <line x1="30" y1="60" x2="90" y2="60" stroke="#2ca02c" stroke-width="3" marker-end="url(#a3)"/>
    <line x1="200" y1="130" x2="140" y2="130" stroke="#2ca02c" stroke-width="3" marker-end="url(#a3)"/>
    <text x="115" y="155" text-anchor="middle" font-size="11" fill="#555555">Deslizamiento → fallas de rumbo</text>
  </g>

  <defs>
    <marker id="a1" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#d62728"/></marker>
    <marker id="a2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1f6feb"/></marker>
    <marker id="a3" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#2ca02c"/></marker>
  </defs>
</svg>
