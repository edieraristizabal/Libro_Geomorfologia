<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="Arial, sans-serif">
  <rect width="640" height="300" fill="#ffffff"/>

  <g transform="translate(20,20)">
    <text x="140" y="0" text-anchor="middle" font-size="13" font-weight="bold" fill="#333333">Depósito Fluvial (creciente súbita)</text>
    <rect x="20" y="30" width="240" height="190" fill="#e8d29a"/>
    <line x1="20" y1="80" x2="260" y2="80" stroke="#8a6a45" stroke-width="1"/>
    <line x1="20" y1="130" x2="260" y2="130" stroke="#8a6a45" stroke-width="1"/>
    <line x1="20" y1="180" x2="260" y2="180" stroke="#8a6a45" stroke-width="1"/>
    <g fill="#8a8a8a">
      <circle cx="60" cy="60" r="9"/><circle cx="100" cy="58" r="8"/><circle cx="150" cy="62" r="9"/><circle cx="200" cy="59" r="8"/>
      <circle cx="60" cy="110" r="8"/><circle cx="110" cy="108" r="9"/><circle cx="160" cy="112" r="8"/><circle cx="210" cy="109" r="9"/>
    </g>
    <text x="140" y="240" text-anchor="middle" font-size="10" fill="#555555">estratificado, clasto-soportado, seleccionado</text>
  </g>

  <g transform="translate(340,20)">
    <text x="140" y="0" text-anchor="middle" font-size="13" font-weight="bold" fill="#333333">Depósito de Flujo de Escombros</text>
    <rect x="20" y="30" width="240" height="190" fill="#8a7256"/>
    <g fill="#5c4326" stroke="#3a2a18" stroke-width="1">
      <circle cx="60" cy="180" r="18"/><circle cx="120" cy="190" r="22"/><circle cx="190" cy="175" r="16"/>
      <circle cx="80" cy="120" r="14"/><circle cx="150" cy="110" r="20"/><circle cx="210" cy="130" r="15"/>
      <circle cx="100" cy="65" r="24"/><circle cx="180" cy="60" r="20"/>
    </g>
    <text x="140" y="240" text-anchor="middle" font-size="10" fill="#555555">masivo, matriz-soportado, gradación inversa</text>
  </g>
</svg>
