<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 340" font-family="Arial, sans-serif">
  <rect width="820" height="340" fill="#ffffff"/>
  <text x="410" y="22" text-anchor="middle" font-size="15" font-weight="bold" fill="#333333">Paisaje de deglaciación: geoformas fluvioglaciales</text>

  <line x1="0" y1="260" x2="820" y2="260" stroke="#5c4326" stroke-width="2"/>
  <rect x="0" y="260" width="820" height="80" fill="#e8d9b8"/>

  <!-- remaining ice block -->
  <path d="M 40 260 Q 60 200 100 210 Q 130 195 150 230 L 150 260 Z" fill="#cfe8f5" opacity="0.7" stroke="#7fb3d5"/>
  <text x="90" y="185" font-size="10" font-weight="bold" fill="#333333">bloque de hielo enterrado</text>

  <!-- kettle (formed after ice melts) -->
  <ellipse cx="230" cy="255" rx="45" ry="16" fill="#7fb3d5"/>
  <path d="M 190 255 Q 230 210 270 255" fill="none" stroke="#8a6a45" stroke-width="3"/>
  <text x="230" y="290" text-anchor="middle" font-size="11" font-weight="bold" fill="#333333">Kettle</text>

  <!-- kame -->
  <ellipse cx="350" cy="240" rx="35" ry="22" fill="#c9a06a" stroke="#6b4020" stroke-width="1.5"/>
  <text x="350" y="290" text-anchor="middle" font-size="11" font-weight="bold" fill="#333333">Kame</text>

  <!-- drumlin -->
  <path d="M 440 260 Q 470 220 530 235 Q 560 250 590 260 Z" fill="#8a6a45" stroke="#5c4326" stroke-width="1.5"/>
  <text x="510" y="290" text-anchor="middle" font-size="11" font-weight="bold" fill="#333333">Drumlin</text>
  <line x1="440" y1="255" x2="590" y2="255" stroke="#333333" stroke-width="1" stroke-dasharray="2 2" marker-end="url(#dgArrow)"/>

  <!-- esker (sinuous ridge) -->
  <path d="M 620 260 Q 650 230 680 245 Q 710 260 740 235" fill="none" stroke="#a0522d" stroke-width="10" stroke-linecap="round"/>
  <text x="670" y="290" text-anchor="middle" font-size="11" font-weight="bold" fill="#333333">Esker</text>

  <!-- outwash plain -->
  <g stroke="#c9a06a" stroke-width="1.5" fill="none">
    <path d="M 30 300 Q 100 295 200 300"/>
    <path d="M 30 315 Q 150 310 300 315"/>
  </g>
  <text x="50" y="330" font-size="10" fill="#555555">Llanura fluvioglacial (outwash)</text>

  <defs>
    <marker id="dgArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#333333"/></marker>
  </defs>
</svg>
