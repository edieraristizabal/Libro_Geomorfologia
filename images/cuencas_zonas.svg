<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 320" font-family="Arial, sans-serif">
  <rect width="780" height="320" fill="#ffffff"/>
  <text x="390" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#333333">Zonas longitudinales de una cuenca</text>

  <path d="M 40 260 Q 250 150 400 190 Q 600 220 740 240" fill="none" stroke="#5c4326" stroke-width="3"/>

  <rect x="20" y="60" width="230" height="20" fill="#d62728" opacity="0.25"/>
  <text x="135" y="55" text-anchor="middle" font-size="12" font-weight="bold" fill="#d62728">Cuenca Alta (Recepción)</text>
  <text x="135" y="100" text-anchor="middle" font-size="10" fill="#555555">valles en V, alta energía, erosión</text>

  <rect x="270" y="90" width="240" height="20" fill="#e67e22" opacity="0.25"/>
  <text x="390" y="85" text-anchor="middle" font-size="12" font-weight="bold" fill="#e67e22">Cuenca Media (Transferencia)</text>
  <text x="390" y="130" text-anchor="middle" font-size="10" fill="#555555">equilibrio erosión-transporte</text>

  <rect x="530" y="120" width="230" height="20" fill="#1f6feb" opacity="0.25"/>
  <text x="645" y="115" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f6feb">Cuenca Baja (Deposición)</text>
  <text x="645" y="160" text-anchor="middle" font-size="10" fill="#555555">valles amplios, ríos meándricos</text>
</svg>
