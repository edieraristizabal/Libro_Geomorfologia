<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" font-family="Arial, sans-serif">
  <rect width="700" height="400" fill="#ffffff"/>
  <text x="350" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#333333">Grados de meteorización (ingeniería geotécnica)</text>

  <g font-size="11" fill="#333333">
    <rect x="40" y="50" width="620" height="40" fill="#4a3520"/>
    <text x="50" y="75" fill="#ffffff" font-weight="bold">VI · Suelo Residual — fábrica de la roca completamente destruida</text>

    <rect x="40" y="90" width="620" height="40" fill="#6b4f30"/>
    <text x="50" y="115" fill="#ffffff" font-weight="bold">V · Saprolito (Roca Completamente Meteorizada) — fábrica original conservada</text>

    <rect x="40" y="130" width="620" height="40" fill="#8a7256"/>
    <text x="50" y="155" fill="#ffffff" font-weight="bold">IV · Roca Altamente Meteorizada — se deshace a mano</text>

    <rect x="40" y="170" width="620" height="40" fill="#a89a8a"/>
    <text x="50" y="195" fill="#333333" font-weight="bold">III · Roca Moderadamente Meteorizada — decoloración en la matriz</text>

    <rect x="40" y="210" width="620" height="40" fill="#c9c2b6"/>
    <text x="50" y="235" fill="#333333" font-weight="bold">II · Roca Ligeramente Meteorizada — decoloración en discontinuidades</text>

    <rect x="40" y="250" width="620" height="40" fill="#e0ded8"/>
    <text x="50" y="275" fill="#333333" font-weight="bold">I · Roca Fresca (R) — sin signos visibles de meteorización</text>
  </g>

  <path d="M 20 60 L 5 60 L 5 280 L 20 280" fill="none" stroke="#333333" stroke-width="2"/>
  <text x="20" y="175" text-anchor="middle" font-size="11" font-weight="bold" fill="#333333" transform="rotate(-90 20 175)">Grado de meteorización creciente</text>

  <text x="350" y="330" text-anchor="middle" font-size="10" fill="#666666">Clasificación basada en Little (1969)</text>
</svg>
